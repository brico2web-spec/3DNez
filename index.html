<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>نظام تسيير الإنتاج</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>
const firebaseConfig={apiKey:"AIzaSyCmpOjdxAkJTL7uE9I_CazbQfh-qSbPnNQ",authDomain:"factory-system-a4db8.firebaseapp.com",projectId:"factory-system-a4db8",storageBucket:"factory-system-a4db8.firebasestorage.app",messagingSenderId:"216358094084",appId:"1:216358094084:web:500d511f7b130f23ecfc51"};
firebase.initializeApp(firebaseConfig);
const db=firebase.firestore();
</script>
<style>
:root{--bg:#f8fafc;--card:#ffffff;--card2:#f1f5f9;--text:#0f172a;--muted:#64748b;--border:#e2e8f0;--primary:#2563eb;--shadow:0 8px 24px rgba(15,23,42,.06);--shadow-lg:0 20px 50px rgba(15,23,42,.12);--ring:0 0 0 4px rgba(37,99,235,.14);--grid:rgba(148,163,184,.12)}
[data-theme="dark"]{--bg:#07070a;--card:#121214;--card2:#1c1c20;--text:#fafafa;--muted:#a1a1aa;--border:#232326;--primary:#3b82f6;--shadow:0 0 0 1px #232326,0 10px 30px rgba(0,0,0,.5);--ring:0 0 0 4px rgba(59,130,246,.25);--grid:rgba(63,63,70,.18)}
*{font-family:'Cairo',system-ui,sans-serif;box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text)}
.grid-bg{position:fixed;inset:0;pointer-events:none;z-index:0;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:56px 56px;mask-image:radial-gradient(ellipse 90% 70% at 50% 0%,black 40%,transparent 90%)}
.card{background:var(--card);border:1px solid var(--border);border-radius:22px;box-shadow:var(--shadow)}
.input{width:100%;height:46px;padding:0 14px;border-radius:12px;border:1px solid var(--border);background:var(--card);color:var(--text);font-weight:700;font-size:13px;outline:none}
.input:focus{border-color:var(--primary);box-shadow:var(--ring)}
.btn{height:42px;padding:0 16px;border-radius:12px;font-weight:800;font-size:12.5px;display:inline-flex;align-items:center;justify-content:center;gap:7px;cursor:pointer;border:1px solid transparent;transition:.2s}
.btn-primary{background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff}
.btn-emerald{background:#ecfdf5;color:#059669;border-color:#a7f3d0}
.btn-slate{background:var(--card2);color:var(--text);border-color:var(--border)}
.btn-dark{background:#0f172a;color:#fff}
[data-theme="dark"] .btn-dark{background:#fafafa;color:#0f172a}
.toggle{width:58px;height:34px;border-radius:999px;background:var(--card2);border:1px solid var(--border);display:flex;align-items:center;padding:3px;cursor:pointer}
.toggle-dot{width:26px;height:26px;border-radius:50%;background:var(--card);border:1px solid var(--border);display:grid;place-items:center;transition:transform .35s;box-shadow:0 2px 6px rgba(0,0,0,.15)}
[data-theme="dark"] .toggle-dot{transform:translateX(-24px)}
.th{font-size:11px;font-weight:900;color:var(--muted);padding:12px 10px;border-bottom:1px solid var(--border);text-align:right;white-space:nowrap}
.td{padding:11px 10px;border-bottom:1px solid var(--border);font-size:13px}
.badge{padding:4px 10px;border-radius:999px;font-size:11px;font-weight:900;display:inline-flex;gap:4px}
.badge-low{background:#fef2f2;color:#dc2626;border:1px solid #fecaca}
.badge-warn{background:#fffbeb;color:#d97706;border:1px solid #fde68a}
.badge-ok{background:#f0fdf4;color:#16a34a;border:1px solid #bbf7d0}
.modal-bg{backdrop-filter:blur(14px);background:rgba(15,23,42,.5)}
.modal{background:var(--card);border:1px solid var(--border);border-radius:20px;box-shadow:var(--shadow-lg)}
@media(max-width:768px){.th{display:none}.tr{border:1px solid var(--border);border-radius:16px;margin-bottom:10px;display:block;padding:6px}.td{display:flex;justify-content:space-between;border:none!important;border-bottom:1px dashed var(--border)!important}.td:last-child{border-bottom:none!important;justify-content:center}.td::before{content:attr(data-label);font-weight:900;font-size:11px;color:var(--muted)}}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="text/babel">
const {useState,useEffect,useRef}=React;
function App(){
  const [theme,setTheme]=useState(localStorage.getItem("factory_theme")||"light");
  useEffect(()=>{document.documentElement.setAttribute("data-theme",theme);localStorage.setItem("factory_theme",theme)},[theme]);
  const [logged,setLogged]=useState(localStorage.getItem("factory_logged")==="1");
  const [tab,setTab]=useState("dashboard");
  const [menu,setMenu]=useState(false);
  const [products,setProducts]=useState([]);
  const [production,setProduction]=useState([]);
  const [stockOut,setStockOut]=useState([]);
  const [workers,setWorkers]=useState([]);
  const [attendance,setAttendance]=useState({});
  const [toasts,setToasts]=useState([]);
  const [showProd,setShowProd]=useState(false);
  const [showWorker,setShowWorker]=useState(false);
  const [showPass,setShowPass]=useState(false);
  const [editProdId,setEditProdId]=useState("");
  const [editWorkerId,setEditWorkerId]=useState("");
  const [attDate,setAttDate]=useState(new Date().toISOString().split('T')[0]);
  const [filterDate,setFilterDate]=useState(new Date().toISOString().split('T')[0]);
  const [search,setSearch]=useState("");
  const [formProd,setFormProd]=useState({worker:"",productRaw:"",qty:"",date:new Date().toISOString().split('T')[0],notes:""});
  const [formOut,setFormOut]=useState({productRaw:"",qty:"",date:new Date().toISOString().split('T')[0],notes:""});
  const [newProd,setNewProd]=useState({code:"",desc:"",unit:"550 ml",boxes:0,itemsPerBox:20,minStock:10,qty:0});
  const [newWorker,setNewWorker]=useState({name:"",phone:""});
  const [attForm,setAttForm]=useState({});
  const [passForm,setPassForm]=useState({current:"",newPass:"",confirm:""});
  const tid=useRef(0);
  const notify=(m,t="ok")=>{const id=++tid.current; setToasts(v=>[...v,{id,m,t}]); setTimeout(()=>setToasts(v=>v.filter(x=>x.id!==id)),3500)};

  useEffect(()=>{
    const u1=db.collection("products").onSnapshot(s=>setProducts(s.docs.map(d=>({id:d.id,...d.data()}))));
    const u2=db.collection("workers").onSnapshot(s=>setWorkers(s.docs.map(d=>({id:d.id,...d.data()}))));
    const u3=db.collection("productionLogs").orderBy("createdAt","desc").limit(500).onSnapshot(s=>setProduction(s.docs.map(d=>({id:d.id,...d.data()}))));
    const u4=db.collection("stockOutLogs").orderBy("createdAt","desc").limit(500).onSnapshot(s=>setStockOut(s.docs.map(d=>({id:d.id,...d.data()}))));
    const u5=db.collection("attendanceLogs").onSnapshot(s=>{const o={}; s.docs.forEach(d=>o[d.id]=d.data().records||{}); setAttendance(o)});
    return ()=>{u1();u2();u3();u4();u5();};
  },[]);

  useEffect(()=>{
    const rec=attendance[attDate]||{};
    const init={}; workers.forEach(w=>init[w.name]=rec[w.name]||"حاضر");
    setAttForm(init);
  },[attDate,attendance,workers]);

  const stockOf=(code)=>{
    const base=products.find(p=>p.code===code)?.qty||0;
    const pr=production.filter(p=>p.code===code).reduce((a,b)=>a+Number(b.qty||0),0);
    const out=stockOut.filter(p=>p.code===code).reduce((a,b)=>a+Number(b.qty||0),0);
    return base+pr-out;
  };
  const getMin=c=>Number(products.find(p=>p.code===c)?.minStock||10);
  const low=products.filter(p=>{const cur=stockOf(p.code); const mn=getMin(p.code); return cur<=mn*1.3});
  const critical=products.filter(p=>stockOf(p.code)<=getMin(p.code));
  const todayProd=production.filter(p=>p.date===new Date().toISOString().split('T')[0]);
  const filtProd=filterDate?production.filter(p=>p.date===filterDate):production;
  const filtProducts=products.filter(p=>`${p.code} ${p.desc}`.toLowerCase().includes(search.toLowerCase()));
  const outByProduct={}; stockOut.forEach(p=>{outByProduct[p.code]=(outByProduct[p.code]||0)+Number(p.qty)});
  const prodByProduct={}; production.forEach(p=>{prodByProduct[p.code]=(prodByProduct[p.code]||0)+Number(p.qty)});
  const prodByWorker={}; production.forEach(p=>{prodByWorker[p.worker]=(prodByWorker[p.worker]||0)+Number(p.qty)});
  const mostConsumed=Object.entries(outByProduct).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const mostProduced=Object.entries(prodByProduct).sort((a,b)=>b[1]-a[1]).slice(0,5);

  const chartProdRef=useRef(null); const chartOutRef=useRef(null); const chartWorkerRef=useRef(null); const chartMonthlyRef=useRef(null);
  const charts=useRef({});

  useEffect(()=>{
    if(tab!=="analytics") return;
    setTimeout(()=>{
      const isDark=theme==="dark"; const textColor=isDark?"#a1a1aa":"#64748b"; const gridColor=isDark?"#232326":"#e2e8f0";
      Object.values(charts.current).forEach(c=>{try{c.destroy()}catch{}});
      if(chartProdRef.current){
        charts.current.prod=new Chart(chartProdRef.current,{type:'bar',data:{labels:Object.keys(prodByProduct).slice(0,8),datasets:[{label:'الإنتاج',data:Object.values(prodByProduct).slice(0,8),backgroundColor:'#3b82f6',borderRadius:8}]},options:{responsive:true,plugins:{legend:{display:false}},scales:{y:{grid:{color:gridColor},ticks:{color:textColor}},x:{grid:{display:false},ticks:{color:textColor}}}}});
      }
      if(chartOutRef.current){
        charts.current.out=new Chart(chartOutRef.current,{type:'doughnut',data:{labels:mostConsumed.map(m=>m[0]),datasets:[{data:mostConsumed.map(m=>m[1]),backgroundColor:['#ef4444','#f59e0b','#3b82f6','#10b981','#8b5cf6'],borderWidth:0}]},options:{responsive:true,plugins:{legend:{position:'bottom',labels:{color:textColor,boxWidth:12,font:{size:11}}}}}});
      }
      if(chartWorkerRef.current){
        charts.current.worker=new Chart(chartWorkerRef.current,{type:'bar',data:{labels:Object.keys(prodByWorker).slice(0,6),datasets:[{label:'إنتاج',data:Object.values(prodByWorker).slice(0,6),backgroundColor:'#10b981',borderRadius:8}]},options:{indexAxis:'y',responsive:true,plugins:{legend:{display:false}},scales:{x:{grid:{color:gridColor},ticks:{color:textColor}},y:{grid:{display:false},ticks:{color:textColor}}}}});
      }
      if(chartMonthlyRef.current){
        const days=[...Array(7)].map((_,i)=>{const d=new Date(); d.setDate(d.getDate()-6+i); return d.toISOString().split('T')[0]});
        const prodDays=days.map(d=>production.filter(p=>p.date===d).reduce((a,b)=>a+Number(b.qty),0));
        const outDays=days.map(d=>stockOut.filter(p=>p.date===d).reduce((a,b)=>a+Number(b.qty),0));
        charts.current.monthly=new Chart(chartMonthlyRef.current,{type:'line',data:{labels:days.map(d=>d.slice(5)),datasets:[{label:'إنتاج',data:prodDays,borderColor:'#3b82f6',backgroundColor:'rgba(59,130,246,.15)',tension:.4,fill:true},{label:'خروج',data:outDays,borderColor:'#ef4444',backgroundColor:'rgba(239,68,68,.1)',tension:.4,fill:true}]},options:{responsive:true,plugins:{legend:{labels:{color:textColor}}},scales:{y:{grid:{color:gridColor},ticks:{color:textColor}},x:{grid:{display:false},ticks:{color:textColor}}}}});
      }
    },300);
  },[tab,theme,production,stockOut,products]);

  const handleLogin=(e)=>{
    e.preventDefault();
    const u=document.getElementById("u").value.trim();
    const pw=document.getElementById("pw").value.trim();
    const savedPass=localStorage.getItem("admin_pass")||"admin123";
    const savedUser=localStorage.getItem("admin_user")||"admin";
    if(u===savedUser && pw===savedPass){setLogged(true); localStorage.setItem("factory_logged","1"); notify("مرحبا 👋");}
    else document.getElementById("err").classList.remove("hidden");
  };

  const handleChangePass=(e)=>{
    e.preventDefault();
    const saved=localStorage.getItem("admin_pass")||"admin123";
    if(passForm.current!==saved) return notify("الحالية خاطئة","err");
    if(passForm.newPass!==passForm.confirm) return notify("التأكيد غير مطابق","err");
    localStorage.setItem("admin_pass",passForm.newPass);
    setShowPass(false); setPassForm({current:"",newPass:"",confirm:""}); notify("تم تغيير الباسورد ✅");
  };

  const handleSaveProd=async(e)=>{
    e.preventDefault();
    const code=newProd.code.toUpperCase().trim();
    if(!code) return notify("أدخل الكود","err");
    if(!editProdId && products.some(p=>p.code===code)) return notify("الكود موجود","err");
    const calcQty = Number(newProd.boxes)*Number(newProd.itemsPerBox);
    const finalQty = calcQty>0 ? calcQty : Number(newProd.qty)||0;
    const data={code,desc:newProd.desc,unit:newProd.unit,boxes:Number(newProd.boxes),itemsPerBox:Number(newProd.itemsPerBox),qty:finalQty,minStock:Number(newProd.minStock||10)};
    if(editProdId){await db.collection("products").doc(editProdId).update(data); notify("تم التحديث");}
    else {await db.collection("products").add({...data,createdAt:new Date()}); notify("تمت الإضافة");}
    setShowProd(false); setEditProdId(""); setNewProd({code:"",desc:"",unit:"550 ml",boxes:0,itemsPerBox:20,minStock:10,qty:0});
  };

  const handleSaveWorker=async(e)=>{
    e.preventDefault();
    if(!newWorker.name) return notify("الاسم مطلوب","err");
    if(editWorkerId){await db.collection("workers").doc(editWorkerId).update(newWorker); notify("تم التحديث");}
    else await db.collection("workers").add({...newWorker,createdAt:new Date()});
    setShowWorker(false); setEditWorkerId(""); setNewWorker({name:"",phone:""});
  };

  const handleProd=async(e)=>{
    e.preventDefault();
    const code=formProd.productRaw.split(" - ")[0].trim().toUpperCase();
    const p=products.find(x=>x.code===code);
    if(!p) return notify("منتج غير صحيح","err");
    await db.collection("productionLogs").add({date:formProd.date,worker:formProd.worker,code:p.code,desc:p.desc,unit:p.unit,qty:Number(formProd.qty),notes:formProd.notes,createdAt:new Date()});
    setFormProd({worker:"",productRaw:"",qty:"",date:formProd.date,notes:""}); notify("تم التسجيل");
  };

  const handleOut=async(e)=>{
    e.preventDefault();
    const code=formOut.productRaw.split(" - ")[0].trim().toUpperCase();
    const p=products.find(x=>x.code===code);
    if(!p) return notify("منتج غير صحيح","err");
    if(Number(formOut.qty)>stockOf(code)) return notify("الكمية أكبر من المخزون ("+stockOf(code)+")","err");
    await db.collection("stockOutLogs").add({date:formOut.date,code:p.code,desc:p.desc,unit:p.unit,qty:Number(formOut.qty),notes:formOut.notes,createdAt:new Date()});
    setFormOut({productRaw:"",qty:"",date:formOut.date,notes:""}); notify("تم تسجيل الخروج");
  };

  const handleAtt=async(e)=>{
    e.preventDefault();
    await db.collection("attendanceLogs").doc(attDate).set({date:attDate,records:attForm,updatedAt:new Date()},{merge:true});
    notify("تم حفظ الحضور");
  };

  const handleExcel=async(e)=>{
    const file=e.target.files[0]; if(!file) return;
    try{
      const buf=await file.arrayBuffer();
      const wb=XLSX.read(buf);
      const ws=wb.Sheets[wb.SheetNames[0]];
      const rows=XLSX.utils.sheet_to_json(ws);
      if(!rows.length) return notify("الملف فارغ","err");
      let count=0;
      for(const r of rows){
        const code=(r["الكود #"]||r["الكود"]||r.code||r.Code||"").toString().toUpperCase().trim();
        if(!code) continue;
        const desc=r["وصف المنتج"]||r["الوصف"]||r.desc||"";
        const unit=r["الوحدة"]||r.unit||"550 ml";
        const items=Number(r["القطع/علبة"]||r["قطع/علبة"]||r.itemsPerBox||20);
        const boxes=Number(r["العلب"]||r.boxes||0);
        const minStock=Number(r["الحد الأدنى"]||r.minStock||10);
        const qty=boxes?boxes*items:Number(r["الكمية"]||0);
        const exist=products.find(p=>p.code===code);
        if(exist){ await db.collection("products").doc(exist.id).update({desc,unit,boxes,itemsPerBox:items,qty:qty||exist.qty,minStock}); }
        else { await db.collection("products").add({code,desc,unit,boxes,itemsPerBox:items,qty,minStock,createdAt:new Date()}); }
        count++;
      }
      notify(`تم استيراد ${count} منتج ✅`);
    }catch(err){ notify("خطأ Excel: "+err.message,"err"); }
    e.target.value="";
  };

  const tabs=[
    {id:"dashboard",title:"المؤشرات",icon:"fa-chart-pie"},
    {id:"production",title:"الإنتاج",icon:"fa-clipboard-check"},
    {id:"attendance",title:"الحضور",icon:"fa-calendar-check"},
    {id:"stockout",title:"الخروج",icon:"fa-truck-fast"},
    {id:"inventory",title:"المخزون",icon:"fa-boxes-stacked"},
    {id:"analytics",title:"التحليل",icon:"fa-chart-line"},
    {id:"workers-info",title:"العمال",icon:"fa-users"},
  ];

  if(!logged){
    return (
      <div className="min-h-screen grid place-items-center p-4">
        <div className="grid-bg"></div>
        <div className="w-full max-w-[400px] card p-7">
          <div className="flex items-center gap-3 mb-6"><div className="w-11 h-11 rounded-xl bg-slate-900 text-white grid place-items-center"><i className="fa-solid fa-industry"></i></div><div><div className="font-black text-[16px]">نظام المصنع</div><div className="text-[11px] text-slate-500 font-bold">دخول</div></div></div>
          <form onSubmit={handleLogin} className="space-y-3"><input id="u" className="input" placeholder="admin" required/><input id="pw" type="password" className="input" placeholder="admin123" required/><div id="err" className="hidden bg-red-500 text-white rounded-xl p-2.5 text-[11px] font-black text-center">خطأ</div><button className="btn btn-dark w-full h-11">دخول</button></form>
        </div>
      </div>
    )
  }

  return (
    <div data-theme={theme}>
      <div className="grid-bg"></div>
      <header className="sticky top-0 z-40 border-b backdrop-blur-xl" style={{background:"color-mix(in srgb, var(--card) 88%, transparent)",borderColor:"var(--border)"}}>
        <div className="mx-auto max-w-[1440px] px-4 h-[60px] flex items-center justify-between gap-3">
          <div className="flex items-center gap-2.5">
            <button onClick={()=>setMenu(true)} className="lg:hidden w-9 h-9 grid place-items-center rounded-xl bg-slate-900 text-white"><i className="fa-solid fa-bars text-[12px]"></i></button>
            <div className="w-8 h-8 rounded-lg bg-gradient-to-br from-blue-600 to-violet-600 grid place-items-center text-white"><i className="fa-solid fa-industry text-[12px]"></i></div>
            <div className="hidden sm:block leading-none"><div className="font-black text-[12.5px]">تسيير الإنتاج</div><div className="text-[10px] font-bold text-slate-500 mt-1">{tabs.find(t=>t.id===tab)?.title}</div></div>
          </div>
          <div className="flex items-center gap-2">
            <div className="hidden lg:flex items-center gap-1 p-1 rounded-full border" style={{background:"var(--card2)",borderColor:"var(--border)"}}>
              {tabs.map(t=>{const a=tab===t.id; return <button key={t.id} onClick={()=>setTab(t.id)} className={`h-7 px-3 rounded-full text-[11px] font-black flex items-center gap-1.5 ${a?'bg-slate-900 text-white shadow':'text-slate-500 hover:bg-white'}`}><i className={`fa-solid ${t.icon} text-[10px]`}></i>{t.title}</button>})}
            </div>
            <button onClick={()=>setTheme(theme==="light"?"dark":"light")} className="toggle"><div className="toggle-dot"><i className={`fa-solid ${theme==="dark"?"fa-moon":"fa-sun"} text-[11px]`}></i></div></button>
            <button onClick={()=>setShowPass(true)} className="w-9 h-9 grid place-items-center rounded-xl border bg-amber-50 text-amber-600" title="تغيير الباسورد"><i className="fa-solid fa-key text-[12px]"></i></button>
            <button onClick={()=>{localStorage.removeItem("factory_logged"); setLogged(false)}} className="w-9 h-9 grid place-items-center rounded-xl border bg-white text-red-500"><i className="fa-solid fa-arrow-right-from-bracket text-[12px]"></i></button>
          </div>
        </div>
      </header>

      {menu && (<div className="fixed inset-0 z-50 lg:hidden"><div onClick={()=>setMenu(false)} className="absolute inset-0 bg-black/40 backdrop-blur-sm"></div><div className="absolute top-0 right-0 h-full w-[300px] card rounded-none p-3 space-y-1 overflow-y-auto"><div className="flex justify-between items-center p-2 border-b mb-2"><b className="text-[12px]">القائمة</b><button onClick={()=>setMenu(false)} className="w-8 h-8 grid place-items-center rounded-lg border"><i className="fa-solid fa-xmark"></i></button></div>{tabs.map(t=><button key={t.id} onClick={()=>{setTab(t.id); setMenu(false)}} className={`w-full h-11 flex items-center gap-3 px-4 rounded-xl font-black text-[12px] ${tab===t.id?'bg-slate-900 text-white':'hover:bg-slate-50'}`}><i className={`fa-solid ${t.icon}`}></i>{t.title}</button>)}<button onClick={()=>{setMenu(false); setShowPass(true)}} className="w-full h-11 flex items-center gap-3 px-4 rounded-xl font-black text-[12px] bg-amber-50 text-amber-700 border border-amber-200 mt-2"><i className="fa-solid fa-key"></i>تغيير الباسورد</button></div></div>)}

      <main className="mx-auto max-w-[1440px] px-3 sm:px-4 py-4 pb-[90px] lg:pb-4 relative z-[1]">

        {tab==="dashboard" && (
          <div className="space-y-3.5">
            <div className="grid grid-cols-2 lg:grid-cols-4 gap-3">
              <div className="card p-4"><div className="text-[10px] font-black text-slate-500">المنتجات</div><div className="text-[22px] font-black mt-2">{products.length}</div></div>
              <div className="card p-4"><div className="text-[10px] font-black text-slate-500">إنتاج اليوم</div><div className="text-[22px] font-black mt-2">{todayProd.reduce((a,b)=>a+Number(b.qty),0)}</div></div>
              <div className="card p-4"><div className="text-[10px] font-black text-slate-500">الأكثر استهلاكا</div><div className="text-[13px] font-black mt-2">{mostConsumed[0]?.[0]||"—"}</div><div className="text-[10px] text-red-500">{mostConsumed[0]?.[1]||0} وحدة</div></div>
              <div className="card p-4" style={{background:critical.length?"#fef2f2":"var(--card)",borderColor:critical.length?"#fecaca":"var(--border)"}}><div className="text-[10px] font-black text-red-600">تنبيه نفاد</div><div className="text-[22px] font-black mt-2 text-red-600">{critical.length}</div><div className="text-[10px] text-red-400">{low.length} قريب</div></div>
            </div>
            {low.length>0 && (
              <div className="card overflow-hidden" style={{borderColor:"#fde68a"}}>
                <div className="p-3.5 flex items-center justify-between" style={{background:"linear-gradient(90deg,#fffbeb,#fef3c7)",borderBottom:"1px solid #fde68a"}}><h3 className="font-black text-[12px] text-amber-800">⚠️ منتجات قريبة من النفاد ({low.length}) - حسب الحد الأدنى</h3><span className="badge badge-warn">{critical.length} حرج</span></div>
                <div className="p-2 grid sm:grid-cols-2 lg:grid-cols-3 gap-2">
                  {low.map(p=>{const cur=stockOf(p.code); const mn=getMin(p.code); const isCrit=cur<=mn; return <div key={p.id} className="p-3 rounded-xl border flex justify-between" style={{background:isCrit?"#fef2f2":"#fffbeb",borderColor:isCrit?"#fecaca":"#fde68a"}}><div><div className="font-mono font-black text-[12px]">{p.code}</div><div className="text-[11px] font-bold">{p.desc}</div><div className="text-[10px] text-slate-500">{cur} / {mn}</div></div><div className={`w-10 h-10 rounded-full grid place-items-center font-black text-[11px] text-white ${isCrit?'bg-red-500':'bg-amber-500'}`}>{cur}</div></div>})}
                </div>
              </div>
            )}
          </div>
        )}

        {tab==="analytics" && (
          <div className="space-y-3">
            <div className="card p-4"><h2 className="font-black text-[14px]">📊 التحليل الإجمالي</h2></div>
            <div className="grid lg:grid-cols-2 gap-3">
              <div className="card p-4"><h3 className="font-black text-[12px] mb-3">الإنتاج حسب المنتج</h3><canvas ref={chartProdRef} height="200"></canvas></div>
              <div className="card p-4"><h3 className="font-black text-[12px] mb-3">المنتجات الأكثر استهلاكا</h3><canvas ref={chartOutRef} height="200"></canvas></div>
            </div>
            <div className="grid lg:grid-cols-2 gap-3">
              <div className="card p-4"><h3 className="font-black text-[12px] mb-3">إنتاج العمال</h3><canvas ref={chartWorkerRef} height="200"></canvas></div>
              <div className="card p-4"><h3 className="font-black text-[12px] mb-3">اتجاه 7 أيام</h3><canvas ref={chartMonthlyRef} height="200"></canvas></div>
            </div>
          </div>
        )}

        {tab==="inventory" && (
          <div className="card p-3.5">
            <div className="flex flex-wrap justify-between gap-3 mb-3.5">
              <h2 className="font-black text-[13px] flex items-center gap-2"><div className="w-7 h-7 rounded-lg bg-gradient-to-br from-cyan-500 to-blue-500 grid place-items-center text-white"><i className="fa-solid fa-boxes-stacked text-[11px]"></i></div>مخزون المنتجات</h2>
              <div className="flex flex-wrap gap-2">
                <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="بحث..." className="input h-9 w-[180px] text-[11px]"/>
                <label className="btn btn-emerald h-9 text-[11px] cursor-pointer"><i className="fa-solid fa-file-excel"></i>رفع Excel<input type="file" accept=".xlsx,.xls,.csv" onChange={handleExcel} className="hidden"/></label>
                <button onClick={()=>{setEditProdId(""); setNewProd({code:"",desc:"",unit:"550 ml",boxes:0,itemsPerBox:20,minStock:10,qty:0}); setShowProd(true)}} className="btn btn-primary h-9 text-[11px]"><i className="fa-solid fa-plus"></i>منتج جديد</button>
              </div>
            </div>
            <div className="overflow-x-auto rounded-xl border"><table className="w-full"><thead><tr style={{background:"var(--card2)"}}><th className="th">الكود</th><th className="th">الوصف</th><th className="th">الحالي</th><th className="th">الأدنى</th><th className="th">الحالة</th><th className="th">إجراء</th></tr></thead><tbody>{filtProducts.map(p=>{const cur=stockOf(p.code); const mn=getMin(p.code); const isLow=cur<=mn; const isWarn=cur<=mn*1.3 && cur>mn; return <tr key={p.id} className="tr"><td data-label="الكود" className="td font-mono font-black text-[12px]">{p.code}</td><td data-label="الوصف" className="td font-bold text-[12px]">{p.desc}</td><td data-label="الحالي" className="td"><span className={`badge ${isLow?'badge-low':isWarn?'badge-warn':'badge-ok'}`}>{cur}</span></td><td data-label="الأدنى" className="td font-black">{mn}</td><td data-label="الحالة" className="td"><span className={`badge ${isLow?'badge-low':isWarn?'badge-warn':'badge-ok'}`}>{isLow?'نفد':isWarn?'قريب':'متوفر'}</span></td><td data-label="إجراء" className="td"><div className="flex gap-1 justify-center"><button onClick={()=>{setEditProdId(p.id); setNewProd({code:p.code,desc:p.desc,unit:p.unit,boxes:p.boxes||0,itemsPerBox:p.itemsPerBox||20,minStock:p.minStock||10,qty:p.qty}); setShowProd(true)}} className="w-7 h-7 grid place-items-center rounded-lg border bg-white"><i className="fa-solid fa-pen text-[10px]"></i></button><button onClick={()=>db.collection("products").doc(p.id).delete()} className="w-7 h-7 grid place-items-center rounded-lg bg-red-50 text-red-500 border"><i className="fa-solid fa-trash text-[10px]"></i></button></div></td></tr>})}</tbody></table></div>
          </div>
        )}

        {tab==="production" && (<div className="max-w-[520px] mx-auto card p-4"><h2 className="font-black text-[13px] mb-3">تسجيل الإنتاج</h2><form onSubmit={handleProd} className="space-y-3"><select value={formProd.worker} onChange={e=>setFormProd({...formProd,worker:e.target.value})} className="input" required><option value="">-- اختر العامل --</option>{workers.map(w=><option key={w.id} value={w.name}>{w.name}</option>)}</select><input list="plist" value={formProd.productRaw} onChange={e=>setFormProd({...formProd,productRaw:e.target.value})} placeholder="الكود - الوصف" className="input" required/><datalist id="plist">{products.map(p=><option key={p.id} value={`${p.code} - ${p.desc}`} />)}</datalist><div className="grid grid-cols-2 gap-2"><input type="number" value={formProd.qty} onChange={e=>setFormProd({...formProd,qty:e.target.value})} placeholder="الكمية" className="input" required/><input type="date" value={formProd.date} onChange={e=>setFormProd({...formProd,date:e.target.value})} className="input"/></div><button className="btn btn-primary w-full h-11">حفظ الإنتاج</button></form></div>)}
        {tab==="stockout" && (<div className="card p-4"><h2 className="font-black text-[12px] mb-3">خروج منتجات</h2><form onSubmit={handleOut} className="space-y-2"><input list="olist" value={formOut.productRaw} onChange={e=>setFormOut({...formOut,productRaw:e.target.value})} placeholder="اختر المنتج" className="input" required/><datalist id="olist">{products.map(p=><option key={p.id} value={`${p.code} - ${p.desc} | متاح: ${stockOf(p.code)}`} />)}</datalist><input type="number" value={formOut.qty} onChange={e=>setFormOut({...formOut,qty:e.target.value})} placeholder="الكمية" className="input" required/><button className="btn w-full bg-red-500 text-white h-11">تأكيد الخروج</button></form></div>)}
        {tab==="attendance" && (<div className="card p-4"><div className="flex justify-between gap-2 mb-3"><h2 className="font-black text-[12px]">الحضور اليومي</h2><input type="date" value={attDate} onChange={e=>setAttDate(e.target.value)} className="input h-9 w-[150px]"/></div><form onSubmit={handleAtt}><table className="w-full"><thead><tr style={{background:"var(--card2)"}}><th className="th">#</th><th className="th">العامل</th><th className="th">الحالة</th></tr></thead><tbody>{workers.map((w,i)=><tr key={w.id} className="tr"><td data-label="#" className="td">{i+1}</td><td data-label="العامل" className="td font-black">{w.name}</td><td data-label="الحالة" className="td"><select value={attForm[w.name]||"حاضر"} onChange={e=>setAttForm({...attForm,[w.name]:e.target.value})} className="input h-9"><option>حاضر ✅</option><option>مريض 🤒</option><option>غير مبرر ⚠️</option></select></td></tr>)}</tbody></table><button className="btn btn-primary h-9 mt-3">حفظ الحضور</button></form></div>)}
        {tab==="workers-info" && (<div className="card p-3.5"><div className="flex justify-between mb-3"><h2 className="font-black text-[12px]">العمال</h2><button onClick={()=>{setEditWorkerId(""); setNewWorker({name:"",phone:""}); setShowWorker(true)}} className="btn btn-dark h-9 text-[11px]">+ عامل</button></div><table className="w-full"><thead><tr style={{background:"var(--card2)"}}><th className="th">#</th><th className="th">الاسم</th><th className="th">إجراء</th></tr></thead><tbody>{workers.map((w,i)=><tr key={w.id} className="tr"><td data-label="#" className="td">{i+1}</td><td data-label="الاسم" className="td font-black">{w.name}</td><td data-label="إجراء" className="td"><button onClick={()=>db.collection("workers").doc(w.id).delete()} className="text-red-500"><i className="fa-solid fa-trash"></i></button></td></tr>)}</tbody></table></div>)}
      </main>

      {showProd && (<div className="fixed inset-0 z-50 modal-bg grid place-items-center p-4"><form onSubmit={handleSaveProd} className="modal p-5 w-full max-w-[440px] space-y-3"><h3 className="font-black text-[13px]">{editProdId?"تعديل المنتج":"منتج جديد"}</h3><input value={newProd.code} onChange={e=>setNewProd({...newProd,code:e.target.value})} placeholder="الكود #" className="input" required/><input value={newProd.desc} onChange={e=>setNewProd({...newProd,desc:e.target.value})} placeholder="وصف المنتج" className="input" required/><input value={newProd.unit} onChange={e=>setNewProd({...newProd,unit:e.target.value})} placeholder="الوحدة" className="input"/><div className="grid grid-cols-3 gap-2"><input type="number" value={newProd.boxes} onChange={e=>setNewProd({...newProd,boxes:e.target.value})} placeholder="العلب" className="input"/><input type="number" value={newProd.itemsPerBox} onChange={e=>setNewProd({...newProd,itemsPerBox:e.target.value})} placeholder="القطع/علبة" className="input"/><input type="number" value={newProd.minStock} onChange={e=>setNewProd({...newProd,minStock:e.target.value})} placeholder="الحد الأدنى" className="input" style={{background:"#fffbeb"}}/></div><div className="flex gap-2"><button className="btn btn-dark flex-1">حفظ</button><button type="button" onClick={()=>setShowProd(false)} className="btn btn-slate flex-1">إلغاء</button></div></form></div>)}
      {showWorker && (<div className="fixed inset-0 z-50 modal-bg grid place-items-center p-4"><form onSubmit={handleSaveWorker} className="modal p-5 w-full max-w-[360px] space-y-3"><h3 className="font-black">عامل</h3><input value={newWorker.name} onChange={e=>setNewWorker({...newWorker,name:e.target.value})} placeholder="اسم العامل" className="input" required/><div className="flex gap-2"><button className="btn btn-dark flex-1">حفظ</button><button type="button" onClick={()=>setShowWorker(false)} className="btn btn-slate flex-1">إلغاء</button></div></form></div>)}
      {showPass && (<div className="fixed inset-0 z-[60] modal-bg grid place-items-center p-4"><form onSubmit={handleChangePass} className="modal p-5 w-full max-w-[380px] space-y-3"><h3 className="font-black text-[13px]">تغيير الباسورد</h3><input type="password" value={passForm.current} onChange={e=>setPassForm({...passForm,current:e.target.value})} placeholder="الحالية" className="input" required/><input type="password" value={passForm.newPass} onChange={e=>setPassForm({...passForm,newPass:e.target.value})} placeholder="الجديدة" className="input" required/><input type="password" value={passForm.confirm} onChange={e=>setPassForm({...passForm,confirm:e.target.value})} placeholder="تأكيد" className="input" required/><div className="flex gap-2"><button className="btn btn-primary flex-1">تغيير</button><button type="button" onClick={()=>setShowPass(false)} className="btn btn-slate flex-1">إلغاء</button></div></form></div>)}

      <div className="fixed bottom-4 right-3 z-[100] flex flex-col gap-2 max-w-[340px]">{toasts.map(t=><div key={t.id} className={`px-4 py-2.5 rounded-xl text-white font-bold text-[11px] ${t.t==="err"?"bg-red-500":"bg-slate-900"}`}>{t.m}</div>)}</div>
    </div>
  )
}
const root=ReactDOM.createRoot(document.getElementById("root"));
root.render(<App/>);
</script>
</body>
</html>
