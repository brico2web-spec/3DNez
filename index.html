          border:1px solid var(--border); background:var(--bg-elevated); box-shadow:var(--shadow);
        }
        [data-theme="dark"] .icon-circle{box-shadow:0 0 0 1px var(--border),0 0 16px var(--primary-glow)}
        .input-premium{
          width:100%; height:48px; padding:0 16px; border-radius:16px;
          border:1px solid var(--border); background:var(--bg-elevated); color:var(--text);
          font-weight:700; font-size:13px; outline:none;
          transition: all .2s ease;
        }
        .input-premium:focus{border-color:var(--primary); box-shadow:var(--ring)}
        .table-premium thead th{
          position:sticky; top:0; z-index:2; background:var(--bg-elevated);
          backdrop-filter:blur(12px); border-bottom:1px solid var(--border);
          font-size:11px; font-weight:900; letter-spacing:.02em; color:var(--text-muted); padding:14px;
        }
        .table-premium tbody tr{border-bottom:1px solid var(--border)}
        .table-premium tbody tr:nth-child(even){background:color-mix(in srgb, var(--bg) 96%, var(--border) 4%)}
        .table-premium tbody tr:hover{background:color-mix(in srgb, var(--primary) 6%, var(--card) 94%); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--primary) 18%, transparent)}
        [data-theme="dark"] .table-premium tbody tr:hover{box-shadow: inset 0 0 0 1px var(--primary-glow), 0 0 20px var(--primary-glow)}
        .modal-backdrop{backdrop-filter: blur(20px) saturate(1.4); background: rgba(9,9,11,.55)}
        [data-theme="light"] .modal-backdrop{background: rgba(15,23,42,.28)}
        .modal-card{animation: modalIn .34s cubic-bezier(.16,1,.3,1); border-radius:28px; background:var(--card); border:1px solid var(--border); box-shadow: var(--shadow-lg)}
        .touch-target{min-height:44px;min-width:44px}
        @media(max-width:768px){
          .responsive-table thead{display:none}
          .responsive-table tbody tr{display:block;background:var(--card);border:1px solid var(--border);border-radius:20px;margin-bottom:12px;padding:12px;box-shadow:var(--shadow)}
          .responsive-table td{display:flex;justify-content:space-between;align-items:center;padding:10px 6px !important;border:none !important;border-bottom:1px dashed var(--border) !important}
          .responsive-table td:last-child{border-bottom:none !important;justify-content:center}
          .responsive-table td::before{content:attr(data-label);font-weight:900;font-size:11px;color:var(--text-muted);white-space:nowrap;margin-left:12px}
        }
