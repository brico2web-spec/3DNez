<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="text/babel">
const {useState,useEffect,useRef}=React;
function App(){
  const [theme,setTheme]=useState(localStorage.getItem("factory_theme")||"light");
  useEffect(()=>{document.documentElement.setAttribute("data-theme",theme);localStorage.setItem("factory_theme",theme)},[theme]);
  const [logged,setLogged]=useState(localStorage.getItem("factory_logged")==="1");
  const [tab,setTab]=useState("dashboard");
  const [menu,setMenu]=useState(false);
  const [products,setProducts]=useState([]);
  const [production,setProduction]=useState([]);
  const [stockOut,setStockOut]=useState([]);
  const [workers,setWorkers]=useState([]);
  const [attendance,setAttendance]=useState({});
  const [toasts,setToasts]=useState([]);
  const [showProd,setShowProd]=useState(false);
  const [showWorker,setShowWorker]=useState(false);
  const [showPass,setShowPass]=useState(false);
  const [confirmDel,setConfirmDel]=useState(null);
  const [archiveDay,setArchiveDay]=useState(null);
  const [archiveMonth,setArchiveMonth]=useState(new Date());
  const [editProdId,setEditProdId]=useState("");
  const [editWorkerId,setEditWorkerId]=useState("");
  const [attDate,setAttDate]=useState(new Date().toISOString().split('T')[0]);
  const [filterDate,setFilterDate]=useState(new Date().toISOString().split('T')[0]);
  const [search,setSearch]=useState("");
  const [formProd,setFormProd]=useState({worker:"",productRaw:"",qty:"",date:new Date().toISOString().split('T')[0],notes:""});
  const [formOut,setFormOut]=useState({productRaw:"",qty:"",date:new Date().toISOString().split('T')[0],notes:""});
  const [newProd,setNewProd]=useState({code:"",desc:"",unit:"550 ml",boxes:0,itemsPerBox:20,minStock:10,qty:0});
  const [newWorker,setNewWorker]=useState({name:"",phone:"",address:""});
  const [attForm,setAttForm]=useState({});
  const [passForm,setPassForm]=useState({current:"",newPass:"",confirm:""});
  const tid=useRef(0);
  const notify=(m,t="ok")=>{const id=++tid.current; setToasts(v=>[...v,{id,m,t}]); setTimeout(()=>setToasts(v=>v.filter(x=>x.id!==id)),3000)};

  useEffect(()=>{
    const u1=db.collection("products").onSnapshot(s=>setProducts(s.docs.map(d=>({id:d.id,...d.data()}))));
    const u2=db.collection("workers").onSnapshot(s=>setWorkers(s.docs.map(d=>({id:d.id,...d.data()}))));
    const u3=db.collection("productionLogs").orderBy("createdAt","desc").limit(1000).onSnapshot(s=>setProduction(s.docs.map(d=>({id:d.id,...d.data()}))));
    const u4=db.collection("stockOutLogs").orderBy("createdAt","desc").limit(1000).onSnapshot(s=>setStockOut(s.docs.map(d=>({id:d.id,...d.data()}))));
    const u5=db.collection("attendanceLogs").onSnapshot(s=>{const o={}; s.docs.forEach(d=>o[d.id]=d.data().records||{}); setAttendance(o)});
    return ()=>{u1();u2();u3();u4();u5();};
  },[]);

  useEffect(()=>{
    const rec=attendance[attDate]||{};
    const init={}; workers.forEach(w=>init[w.name]=rec[w.name]||"حاضر");
    setAttForm(init);
  },[attDate,attendance,workers]);

  const stockOf=(code)=>{
    const base=products.find(p=>p.code===code)?.qty||0;
    const pr=production.filter(p=>p.code===code).reduce((a,b)=>a+Number(b.qty||0),0);
    const out=stockOut.filter(p=>p.code===code).reduce((a,b)=>a+Number(b.qty||0),0);
    return base+pr-out;
  };
  const getMin=c=>Number(products.find(p=>p.code===c)?.minStock||10);
  const low=products.filter(p=>{const cur=stockOf(p.code); const mn=getMin(p.code); return cur<=mn*1.3});
  const critical=products.filter(p=>stockOf(p.code)<=getMin(p.code));
  const todayProd=production.filter(p=>p.date===new Date().toISOString().split('T')[0]);
  const filtProd=filterDate?production.filter(p=>p.date===filterDate):production;
  const filtProducts=products.filter(p=>`${p.code} ${p.desc}`.toLowerCase().includes(search.toLowerCase()));
  const outByProduct={}; stockOut.forEach(p=>{outByProduct[p.code]=(outByProduct[p.code]||0)+Number(p.qty)});
  const prodByProduct={}; production.forEach(p=>{prodByProduct[p.code]=(prodByProduct[p.code]||0)+Number(p.qty)});
  const prodByWorker={}; production.forEach(p=>{prodByWorker[p.worker]=(prodByWorker[p.worker]||0)+Number(p.qty)});
  const mostConsumed=Object.entries(outByProduct).sort((a,b)=>b[1]-a[1]).slice(0,5);

  const exportExcel=(data,fileName)=>{
    const ws=XLSX.utils.json_to_sheet(data);
    const wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,ws,"Data");
    XLSX.writeFile(wb,`${fileName}_${new Date().toISOString().split('T')[0]}.xlsx`);
    notify(`تم تحميل ${fileName} ✅`);
  };

  // Archive calendar logic
  const getDaysInMonth=(date)=>{
    const year=date.getFullYear(); const month=date.getMonth();
    const firstDay=new Date(year,month,1).getDay();
    const daysInMonth=new Date(year,month+1,0).getDate();
    const days=[];
    const startOffset = (firstDay+6)%7; // make Monday=0
    for(let i=0;i<startOffset;i++) days.push(null);
    for(let d=1; d<=daysInMonth; d++){
      const iso=`${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      const prod=production.filter(p=>p.date===iso);
      const out=stockOut.filter(p=>p.date===iso);
      const att=attendance[iso]||{};
      const presentCount=Object.values(att).filter(v=>v.includes("حاضر")).length;
      days.push({day:d, iso, prod, out, att, presentCount});
    }
    return days;
  };
  const calendarDays=getDaysInMonth(archiveMonth);
  const selectedDayData = archiveDay ? {
    iso: archiveDay.iso,
    prod: production.filter(p=>p.date===archiveDay.iso),
    out: stockOut.filter(p=>p.date===archiveDay.iso),
    att: attendance[archiveDay.iso]||{},
  } : null;

  const handleLogin=(e)=>{
    e.preventDefault();
    const u=document.getElementById("u").value.trim();
    const pw=document.getElementById("pw").value.trim();
    const savedPass=localStorage.getItem("admin_pass")||"admin123";
    if(u==="admin" && pw===savedPass){setLogged(true); localStorage.setItem("factory_logged","1"); notify("مرحبا 👋");}
    else document.getElementById("err").classList.remove("hidden");
  };

  const handleChangePass=(e)=>{
    e.preventDefault();
    const saved=localStorage.getItem("admin_pass")||"admin123";
    if(passForm.current!==saved) return notify("الحالية خاطئة","err");
    if(passForm.newPass!==passForm.confirm) return notify("التأكيد غير مطابق","err");
    localStorage.setItem("admin_pass",passForm.newPass);
    setShowPass(false); setPassForm({current:"",newPass:"",confirm:""}); notify("تم تغيير الباسورد ✅");
  };

  const handleSaveProd=async(e)=>{
    e.preventDefault();
    const code=newProd.code.toUpperCase().trim();
    if(!code) return notify("أدخل الكود","err");
    if(!editProdId && products.some(p=>p.code===code)) return notify("الكود موجود","err");
    const calcQty = Number(newProd.boxes)*Number(newProd.itemsPerBox);
    const finalQty = calcQty>0 ? calcQty : Number(newProd.qty)||0;
    const data={code,desc:newProd.desc,unit:newProd.unit,boxes:Number(newProd.boxes),itemsPerBox:Number(newProd.itemsPerBox),qty:finalQty,minStock:Number(newProd.minStock||10)};
    if(editProdId){await db.collection("products").doc(editProdId).update(data); notify("تم التحديث");}
    else {await db.collection("products").add({...data,createdAt:new Date()}); notify("تمت الإضافة");}
    setShowProd(false); setEditProdId(""); setNewProd({code:"",desc:"",unit:"550 ml",boxes:0,itemsPerBox:20,minStock:10,qty:0});
  };

  const handleSaveWorker=async(e)=>{
    e.preventDefault();
    if(!newWorker.name) return notify("الاسم مطلوب","err");
    if(editWorkerId){await db.collection("workers").doc(editWorkerId).update(newWorker); notify("تم التحديث");}
    else await db.collection("workers").add({...newWorker,createdAt:new Date()});
    setShowWorker(false); setEditWorkerId(""); setNewWorker({name:"",phone:"",address:""});
  };

  const handleProd=async(e)=>{
    e.preventDefault();
    const code=formProd.productRaw.split(" - ")[0].trim().toUpperCase();
    const p=products.find(x=>x.code===code);
    if(!p) return notify("منتج غير صحيح","err");
    await db.collection("productionLogs").add({date:formProd.date,worker:formProd.worker,code:p.code,desc:p.desc,unit:p.unit,qty:Number(formProd.qty),notes:formProd.notes,createdAt:new Date()});
    setFormProd({worker:"",productRaw:"",qty:"",date:formProd.date,notes:""}); notify("تم التسجيل");
  };

  const handleOut=async(e)=>{
    e.preventDefault();
    const code=formOut.productRaw.split(" - ")[0].trim().toUpperCase();
    const p=products.find(x=>x.code===code);
    if(!p) return notify("منتج غير صحيح","err");
    if(Number(formOut.qty)>stockOf(code)) return notify("الكمية أكبر من المخزون ("+stockOf(code)+")","err");
    await db.collection("stockOutLogs").add({date:formOut.date,code:p.code,desc:p.desc,unit:p.unit,qty:Number(formOut.qty),notes:formOut.notes,createdAt:new Date()});
    setFormOut({productRaw:"",qty:"",date:formOut.date,notes:""}); notify("تم تسجيل الخروج");
  };

  const handleAtt=async(e)=>{
    e.preventDefault();
    await db.collection("attendanceLogs").doc(attDate).set({date:attDate,records:attForm,updatedAt:new Date()},{merge:true});
    notify("تم حفظ الحضور");
  };

  const handleExcelImport=async(e)=>{
    const file=e.target.files[0]; if(!file) return;
    try{
      const buf=await file.arrayBuffer();
      const wb=XLSX.read(buf);
      const ws=wb.Sheets[wb.SheetNames[0]];
      const rows=XLSX.utils.sheet_to_json(ws);
      let count=0;
      for(const r of rows){
        const code=(r["الكود #"]||r["الكود"]||r.code||"").toString().toUpperCase().trim();
        if(!code) continue;
        const desc=r["وصف المنتج"]||r["الوصف"]||r.desc||"";
        const unit=r["الوحدة"]||r.unit||"550 ml";
        const items=Number(r["القطع/علبة"]||r["قطع/علبة"]||r.itemsPerBox||20);
        const boxes=Number(r["العلب"]||r.boxes||0);
        const minStock=Number(r["الحد الأدنى"]||r.minStock||10);
        const qty=boxes?boxes*items:Number(r["الكمية"]||0);
        const exist=products.find(p=>p.code===code);
        if(exist){ await db.collection("products").doc(exist.id).update({desc,unit,boxes,itemsPerBox:items,qty:qty||exist.qty,minStock}); }
        else { await db.collection("products").add({code,desc,unit,boxes,itemsPerBox:items,qty,minStock,createdAt:new Date()}); }
        count++;
      }
      notify(`تم استيراد ${count} منتج ✅`);
    }catch(err){ notify("خطأ: "+err.message,"err"); }
    e.target.value="";
  };

  const tabColors={
    dashboard:{bg:"active-blue",icon:"icon-blue",dot:"#3b82f6"},
    inventory:{bg:"active-emerald",icon:"icon-emerald",dot:"#10b981"},
    stockout:{bg:"active-orange",icon:"icon-orange",dot:"#f97316"},
    attendance:{bg:"active-violet",icon:"icon-violet",dot:"#8b5cf6"},
    archive:{bg:"active-cyan",icon:"icon-cyan",dot:"#06b6d4"},
    production:{bg:"active-cyan",icon:"icon-cyan",dot:"#0891b2"},
    "workers-info":{bg:"active-rose",icon:"icon-rose",dot:"#e11d48"},
  };
  const tabs=[
    {id:"dashboard",title:"الرئيسية",icon:"fa-house",color:"blue"},
    {id:"inventory",title:"المخزن",icon:"fa-boxes-stacked",color:"emerald"},
    {id:"stockout",title:"الخروج",icon:"fa-truck-fast",color:"orange"},
    {id:"attendance",title:"الحضور",icon:"fa-calendar-check",color:"violet"},
    {id:"archive",title:"الأرشيف",icon:"fa-calendar-days",color:"cyan"},
    {id:"production",title:"الإنتاج",icon:"fa-clipboard-check",color:"cyan"},
    {id:"workers-info",title:"العمال",icon:"fa-users",color:"rose"},
  ];

  const bottomTabs=[
    {id:"dashboard",title:"الرئيسية",icon:"fa-house",active:"from-blue-600 to-indigo-600"},
    {id:"inventory",title:"المخزن",icon:"fa-boxes-stacked",active:"from-emerald-600 to-teal-600"},
    {id:"stockout",title:"الخروج",icon:"fa-truck-fast",active:"from-orange-600 to-amber-600"},
    {id:"attendance",title:"الحضور",icon:"fa-calendar-check",active:"from-violet-600 to-purple-600"},
    {id:"archive",title:"الأرشيف",icon:"fa-calendar-days",active:"from-cyan-600 to-blue-600"},
  ];

  if(!logged){
    return (
      <div className="min-h-screen grid place-items-center p-4">
        <div className="grid-bg"></div>
        <div className="w-full max-w-[360px] card p-6">
          <div className="flex items-center gap-3 mb-5"><div className="w-11 h-11 rounded-xl bg-gradient-to-br from-indigo-600 to-violet-600 text-white grid place-items-center shadow-lg shadow-indigo-500/30"><i className="fa-solid fa-industry text-[14px]"></i></div><div><div className="font-black text-[14px] flex items-center gap-1.5">نظام المصنع <span className="badge badge-blue">Archive</span></div><div className="text-[10px] text-slate-500 font-bold">مرحبا بعودتك 👋</div></div></div>
          <form onSubmit={handleLogin} className="space-y-2.5"><input id="u" className="input" placeholder="admin" required/><input id="pw" type="password" className="input" placeholder="كلمة المرور" required/><div id="err" className="hidden bg-red-500 text-white rounded-xl p-2 text-[10px] font-black text-center">خطأ</div><button className="btn btn-primary w-full h-10 shadow-lg shadow-slate-900/20 text-[12px]">دخول</button></form>
        </div>
      </div>
    )
  }

  return (
    <div data-theme={theme}>
      <div className="grid-bg"></div>
      <header className="sticky top-0 z-30 border-b backdrop-blur-xl" style={{background:"color-mix(in srgb, var(--card) 88%, transparent)",borderColor:"var(--border)"}}>
        <div className="mx-auto max-w-[1440px] px-3 h-[52px] flex items-center justify-between gap-2">
          <div className="flex items-center gap-2">
            <button onClick={()=>setMenu(true)} className="lg:hidden w-8 h-8 grid place-items-center rounded-lg bg-slate-900 text-white"><i className="fa-solid fa-bars text-[11px]"></i></button>
            <div className="w-7 h-7 rounded-lg bg-gradient-to-br from-blue-600 to-violet-600 grid place-items-center text-white"><i className="fa-solid fa-industry text-[10px]"></i></div>
            <div className="hidden sm:block leading-none"><div className="font-black text-[11.5px]">تسيير الإنتاج</div><div className="text-[9px] font-bold text-slate-500 mt-0.5">{tabs.find(t=>t.id===tab)?.title}</div></div>
          </div>
          <div className="flex items-center gap-1.5">
            <div className="hidden lg:flex items-center gap-0.5 p-1 rounded-full border" style={{background:"var(--card2)",borderColor:"var(--border)"}}>
              {tabs.map(t=>{const a=tab===t.id; const col=tabColors[t.id]; return <button key={t.id} onClick={()=>setTab(t.id)} className={`tab-pill h-7 px-3 rounded-full text-[10px] font-black flex items-center gap-1.5 transition-all ${a?col.bg+' text-white scale-105':'text-slate-500 hover:bg-white hover:shadow-sm border border-transparent hover:border-slate-200'}`}><i className={`fa-solid ${t.icon} text-[11px]`}></i>{t.title}</button>})}
            </div>
            <button onClick={()=>setTheme(theme==="light"?"dark":"light")} className="toggle"><div className="toggle-dot"><i className={`fa-solid ${theme==="dark"?"fa-moon":"fa-sun"} text-[10px]`}></i></div></button>
            <button onClick={()=>setShowPass(true)} className="w-8 h-8 grid place-items-center rounded-lg border bg-amber-50 text-amber-600"><i className="fa-solid fa-key text-[10px]"></i></button>
            <button onClick={()=>{localStorage.removeItem("factory_logged"); setLogged(false)}} className="w-8 h-8 grid place-items-center rounded-lg border bg-white text-red-500"><i className="fa-solid fa-right-from-bracket text-[10px]"></i></button>
          </div>
        </div>
      </header>

      {menu && (<div className="fixed inset-0 z-40 lg:hidden"><div onClick={()=>setMenu(false)} className="absolute inset-0 bg-black/30 backdrop-blur-sm"></div><div className="absolute top-0 right-0 h-full w-[280px] card rounded-none p-2.5 space-y-1 overflow-y-auto"><div className="flex justify-between items-center p-2 border-b mb-2"><b className="text-[11px]">القائمة</b><button onClick={()=>setMenu(false)} className="w-7 h-7 grid place-items-center rounded-lg border"><i className="fa-solid fa-xmark text-[10px]"></i></button></div>{tabs.map(t=><button key={t.id} onClick={()=>{setTab(t.id); setMenu(false)}} className={`w-full h-9 flex items-center gap-2.5 px-3 rounded-lg font-bold text-[11px] ${tab===t.id?'bg-slate-900 text-white':'hover:bg-slate-50'}`}><i className={`fa-solid ${t.icon} text-[11px]`}></i>{t.title}</button>)}<button onClick={()=>{setMenu(false); setShowPass(true)}} className="w-full h-9 flex items-center gap-2.5 px-3 rounded-lg font-bold text-[11px] bg-amber-50 text-amber-700 border border-amber-200 mt-2"><i className="fa-solid fa-key"></i>تغيير الباسورد</button></div></div>)}

      <main className="mx-auto max-w-[1440px] px-3 py-3 pb-[80px] lg:pb-3 relative z-[1]">

        {tab==="dashboard" && (
          <div className="space-y-3">
            <div className="grid grid-cols-2 lg:grid-cols-4 gap-3">
              <div className="stat-card stat-blue">
                <div className="flex justify-between items-start"><div><div className="text-[10px] font-black opacity-90 flex items-center gap-1.5"><i className="fa-solid fa-boxes-stacked"></i>المنتجات</div><div className="text-[26px] font-black mt-1">{products.length}</div><div className="text-[9px] font-bold opacity-80 mt-1">منتج في المخزن</div></div><div className="stat-icon"><i className="fa-solid fa-cubes"></i></div></div>
              </div>
              <div className="stat-card stat-emerald">
                <div className="flex justify-between items-start"><div><div className="text-[10px] font-black opacity-90 flex items-center gap-1.5"><i className="fa-solid fa-industry"></i>إنتاج اليوم</div><div className="text-[26px] font-black mt-1">{todayProd.reduce((a,b)=>a+Number(b.qty),0)}</div><div className="text-[9px] font-bold opacity-80 mt-1">قطعة منتجة</div></div><div className="stat-icon"><i className="fa-solid fa-chart-line"></i></div></div>
              </div>
              <div className="stat-card stat-orange">
                <div className="flex justify-between items-start"><div><div className="text-[10px] font-black opacity-90 flex items-center gap-1.5"><i className="fa-solid fa-fire"></i>الأكثر طلبا</div><div className="text-[13px] font-black mt-1.5 truncate max-w-[100px]">{mostConsumed[0]?.[0]||"—"}</div><div className="text-[9px] font-bold opacity-80 mt-1">{mostConsumed[0]?.[1]||0} خروج</div></div><div className="stat-icon"><i className="fa-solid fa-ranking-star"></i></div></div>
              </div>
              <div className={`stat-card ${critical.length?'stat-rose':'stat-violet'}`} style={{border:critical.length?'2px solid #fecdd3':''}}>
                <div className="flex justify-between items-start"><div><div className="text-[10px] font-black opacity-90 flex items-center gap-1.5"><i className={`fa-solid ${critical.length?'fa-triangle-exclamation':'fa-shield-check'}`}></i>{critical.length?'تنبيه حرج':'الوضع آمن'}</div><div className="text-[26px] font-black mt-1">{critical.length}</div><div className="text-[9px] font-bold opacity-80 mt-1">{critical.length?'منتج ناقص':'لا يوجد نقص'}</div></div><div className="stat-icon"><i className={`fa-solid ${critical.length?'fa-bell':'fa-check'}`}></i></div></div>
              </div>
            </div>
            {low.length>0 && (<div className="card overflow-hidden" style={{borderColor:"#fde68a"}}><div className="px-3 py-2.5 flex items-center justify-between" style={{background:"linear-gradient(90deg,#fffbeb,#fef3c7)",borderBottom:"1px solid #fde68a"}}><h3 className="font-bold text-[11px] text-amber-800">🚨 تنبيه نفاد المخزون ({low.length})</h3><span className="badge badge-warn text-[9px]">{critical.length} حرج</span></div><div className="p-2 grid sm:grid-cols-2 lg:grid-cols-3 gap-1.5">{low.map(p=>{const cur=stockOf(p.code); const mn=getMin(p.code); const isCrit=cur<=mn; return <div key={p.id} className="px-2.5 py-2 rounded-xl border flex justify-between items-center" style={{background:isCrit?"#fef2f2":"#fffbeb",borderColor:isCrit?"#fecaca":"#fde68a"}}><div><div className="font-mono font-black text-[11px]">{p.code}</div><div className="text-[10px] font-bold truncate max-w-[140px]">{p.desc}</div><div className="text-[9px] text-slate-500">{cur} / {mn}</div></div><div className={`w-8 h-8 rounded-full grid place-items-center font-black text-[10px] text-white ${isCrit?'bg-red-500':'bg-amber-500'}`}>{cur}</div></div>})}</div></div>)}
          </div>
        )}

        {tab==="archive" && (
          <div className="space-y-3">
            <div className="card p-3 flex flex-wrap items-center justify-between gap-2">
              <h2 className="font-bold text-[13px] flex items-center gap-2"><div className="w-7 h-7 rounded-lg bg-slate-900 text-white grid place-items-center"><i className="fa-solid fa-calendar-days text-[11px]"></i></div>أرشيف يومي - {archiveMonth.toLocaleDateString('ar-MA',{month:'long', year:'numeric'})}</h2>
              <div className="flex items-center gap-1.5">
                <button onClick={()=>setArchiveMonth(new Date(archiveMonth.getFullYear(), archiveMonth.getMonth()-1, 1))} className="btn btn-slate h-8 w-8 p-0"><i className="fa-solid fa-chevron-right text-[10px]"></i></button>
                <button onClick={()=>setArchiveMonth(new Date())} className="btn btn-primary h-8 text-[10px]">اليوم</button>
                <button onClick={()=>setArchiveMonth(new Date(archiveMonth.getFullYear(), archiveMonth.getMonth()+1, 1))} className="btn btn-slate h-8 w-8 p-0"><i className="fa-solid fa-chevron-left text-[10px]"></i></button>
                <button onClick={()=>exportExcel(calendarDays.filter(d=>d).map(d=>({التاريخ:d.iso,إنتاج:d.prod.reduce((a,b)=>a+Number(b.qty),0),خروج:d.out.reduce((a,b)=>a+Number(b.qty),0),حاضر:Object.values(attendance[d.iso]||{}).filter(v=>v.includes("حاضر")).length})),"أرشيف_"+archiveMonth.toISOString().slice(0,7))} className="btn btn-blue h-8 text-[10px]"><i className="fa-solid fa-download"></i>Excel الشهر</button>
              </div>
            </div>

            <div className="card p-3">
              <div className="grid grid-cols-7 gap-1 mb-2 text-center">
                {["الإثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت","الأحد"].map(d=><div key={d} className="text-[9.5px] font-black text-slate-500 py-1">{d}</div>)}
              </div>
              <div className="calendar-grid">
                {calendarDays.map((d,i)=>{
                  if(!d) return <div key={i} className="calendar-day empty"></div>;
                  const hasData = d.prod.length>0 || d.out.length>0 || Object.keys(d.att).length>0;
                  const isToday = d.iso===new Date().toISOString().split('T')[0];
                  return (
                    <div key={d.iso} onClick={()=>setArchiveDay(d)} className={`calendar-day ${hasData?'has-data':''} ${isToday?'today':''}`}>
                      <div className="flex justify-between items-start"><span className="font-black text-[12px]">{d.day}</span>{hasData && <span className="w-1.5 h-1.5 rounded-full bg-blue-500"></span>}</div>
                      {hasData && (
                        <div className="mt-1 space-y-0.5">
                          {d.prod.length>0 && <div className="text-[8.5px] bg-emerald-100 text-emerald-700 px-1 rounded font-bold">إنتاج {d.prod.reduce((a,b)=>a+Number(b.qty),0)}</div>}
                          {d.out.length>0 && <div className="text-[8.5px] bg-red-100 text-red-700 px-1 rounded font-bold">خروج {d.out.reduce((a,b)=>a+Number(b.qty),0)}</div>}
                          {Object.keys(d.att).length>0 && <div className="text-[8.5px] bg-blue-100 text-blue-700 px-1 rounded font-bold">حضور {d.presentCount}</div>}
                        </div>
                      )}
                    </div>
                  )
                })}
              </div>
              <div className="mt-3 flex gap-2 text-[9.5px]"><div className="flex items-center gap-1"><div className="w-2 h-2 rounded-full bg-blue-500"></div>يوجد بيانات</div><div className="flex items-center gap-1"><div className="w-4 h-4 rounded border-2 border-blue-600"></div>اليوم</div></div>
            </div>
          </div>
        )}

        {tab==="inventory" && (
          <div className="card p-3">
            <div className="flex flex-wrap justify-between gap-2 mb-3"><h2 className="font-bold text-[12px] flex items-center gap-1.5"><div className="w-6 h-6 rounded-lg bg-blue-600 text-white grid place-items-center"><i className="fa-solid fa-boxes-stacked text-[10px]"></i></div>المخزون</h2><div className="flex flex-wrap gap-1.5"><input value={search} onChange={e=>setSearch(e.target.value)} placeholder="بحث..." className="input input-sm w-[120px]"/><label className="btn btn-emerald h-8 text-[10px] cursor-pointer"><i className="fa-solid fa-upload"></i>استيراد<input type="file" accept=".xlsx,.xls,.csv" onChange={handleExcelImport} className="hidden"/></label><button onClick={()=>exportExcel(products.map(p=>({الكود:p.code,الوصف:p.desc,الوحدة:p.unit,الحالي:stockOf(p.code),الحد_الأدنى:getMin(p.code)})),"المخزون")} className="btn btn-blue h-8 text-[10px]"><i className="fa-solid fa-download"></i>Excel</button><button onClick={()=>{setEditProdId(""); setNewProd({code:"",desc:"",unit:"550 ml",boxes:0,itemsPerBox:20,minStock:10,qty:0}); setShowProd(true)}} className="btn btn-primary h-8 text-[10px]"><i className="fa-solid fa-plus"></i>جديد</button></div></div>
            <div className="overflow-x-auto rounded-xl border"><table className="w-full"><thead><tr style={{background:"var(--card2)"}}><th className="th">الكود</th><th className="th">الوصف</th><th className="th">الحالي</th><th className="th">الأدنى</th><th className="th">الحالة</th><th className="th">إجراء</th></tr></thead><tbody>{filtProducts.map(p=>{const cur=stockOf(p.code); const mn=getMin(p.code); const isLow=cur<=mn; const isWarn=cur<=mn*1.3 && cur>mn; return <tr key={p.id} className="tr"><td data-label="الكود" className="td font-mono font-black text-[11px]">{p.code}</td><td data-label="الوصف" className="td font-bold text-[11px]">{p.desc}</td><td data-label="الحالي" className="td"><span className={`badge ${isLow?'badge-low':isWarn?'badge-warn':'badge-ok'}`}>{cur}</span></td><td data-label="الأدنى" className="td font-bold text-[11px]">{mn}</td><td data-label="الحالة" className="td"><span className={`badge ${isLow?'badge-low':isWarn?'badge-warn':'badge-ok'}`}>{isLow?'نفد':isWarn?'قريب':'متوفر'}</span></td><td data-label="إجراء" className="td"><div className="flex gap-1 justify-center"><button onClick={()=>{setEditProdId(p.id); setNewProd({code:p.code,desc:p.desc,unit:p.unit,boxes:p.boxes||0,itemsPerBox:p.itemsPerBox||20,minStock:p.minStock||10,qty:p.qty}); setShowProd(true)}} className="w-6 h-6 grid place-items-center rounded-md border bg-white"><i className="fa-solid fa-pen text-[9px]"></i></button><button onClick={()=>setConfirmDel({type:'products', id:p.id, name:p.code})} className="w-6 h-6 grid place-items-center rounded-md bg-red-50 text-red-500 border"><i className="fa-solid fa-trash text-[9px]"></i></button></div></td></tr>})}</tbody></table></div>
          </div>
        )}

        {tab==="stockout" && (
          <div className="space-y-3">
            <div className="card p-3"><div className="flex justify-between items-center mb-2.5"><h2 className="font-bold text-[12px]">خروج منتجات</h2><button onClick={()=>exportExcel(stockOut.map(s=>({التاريخ:s.date,الكود:s.code,الوصف:s.desc,الكمية:s.qty})),"تقرير_الخروج")} className="btn btn-blue h-7 text-[10px]"><i className="fa-solid fa-download"></i>تحميل Excel</button></div><form onSubmit={handleOut} className="grid grid-cols-2 gap-2"><input list="olist" value={formOut.productRaw} onChange={e=>setFormOut({...formOut,productRaw:e.target.value})} placeholder="المنتج" className="input col-span-2" required/><datalist id="olist">{products.map(p=><option key={p.id} value={`${p.code} - ${p.desc} | متاح: ${stockOf(p.code)}`} />)}</datalist><input type="number" value={formOut.qty} onChange={e=>setFormOut({...formOut,qty:e.target.value})} placeholder="الكمية" className="input" required/><input type="date" value={formOut.date} onChange={e=>setFormOut({...formOut,date:e.target.value})} className="input"/><button className="btn bg-red-500 text-white col-span-2 h-9">تأكيد الخروج</button></form></div>
            <div className="card p-3"><div className="overflow-x-auto"><table className="w-full"><thead><tr style={{background:"var(--card2)"}}><th className="th">التاريخ</th><th className="th">الكود</th><th className="th">الكمية</th><th className="th">حذف</th></tr></thead><tbody>{stockOut.slice(0,100).map(s=><tr key={s.id} className="tr"><td data-label="التاريخ" className="td text-[10px]">{s.date}</td><td data-label="الكود" className="td font-mono font-black text-red-500 text-[11px]">{s.code}</td><td data-label="الكمية" className="td text-[11px]">{s.qty}</td><td data-label="حذف" className="td"><button onClick={()=>setConfirmDel({type:'stockOutLogs', id:s.id, name:s.code})} className="text-red-500"><i className="fa-solid fa-trash text-[10px]"></i></button></td></tr>)}</tbody></table></div></div>
          </div>
        )}

        {tab==="attendance" && (
          <div className="card p-3"><div className="flex flex-wrap justify-between gap-2 mb-2.5"><h2 className="font-bold text-[12px]">الحضور اليومي</h2><div className="flex gap-1.5"><input type="date" value={attDate} onChange={e=>setAttDate(e.target.value)} className="input input-sm w-[130px]"/><button onClick={()=>exportExcel(Object.entries(attForm).map(([name,status])=>({العامل:name,الحالة:status,التاريخ:attDate})),"تقرير_الحضور")} className="btn btn-blue h-7 text-[10px]"><i className="fa-solid fa-download"></i>Excel</button></div></div><form onSubmit={handleAtt}><table className="w-full"><thead><tr style={{background:"var(--card2)"}}><th className="th">#</th><th className="th">العامل</th><th className="th">الحالة</th></tr></thead><tbody>{workers.map((w,i)=><tr key={w.id} className="tr"><td data-label="#" className="td text-[10px]">{i+1}</td><td data-label="العامل" className="td font-bold text-[11px]">{w.name}</td><td data-label="الحالة" className="td"><select value={attForm[w.name]||"حاضر"} onChange={e=>setAttForm({...attForm,[w.name]:e.target.value})} className="input input-sm"><option>حاضر ✅</option><option>مريض 🤒</option><option>غير مبرر ⚠️</option></select></td></tr>)}</tbody></table><button className="btn btn-primary h-8 mt-2 text-[11px]">حفظ الحضور</button></form></div>
        )}

        {tab==="production" && (
          <div className="card p-3"><div className="flex justify-between items-center mb-2.5"><h2 className="font-bold text-[12px]">تسجيل الإنتاج</h2><button onClick={()=>exportExcel(production.map(p=>({التاريخ:p.date,العامل:p.worker,الكود:p.code,الكمية:p.qty})),"تقرير_الانتاج")} className="btn btn-blue h-7 text-[10px]"><i className="fa-solid fa-download"></i>Excel</button></div><form onSubmit={handleProd} className="grid grid-cols-2 gap-2"><select value={formProd.worker} onChange={e=>setFormProd({...formProd,worker:e.target.value})} className="input col-span-2" required><option value="">-- اختر العامل --</option>{workers.map(w=><option key={w.id} value={w.name}>{w.name}</option>)}</select><input list="plist" value={formProd.productRaw} onChange={e=>setFormProd({...formProd,productRaw:e.target.value})} placeholder="الكود - الوصف" className="input col-span-2" required/><datalist id="plist">{products.map(p=><option key={p.id} value={`${p.code} - ${p.desc}`} />)}</datalist><input type="number" value={formProd.qty} onChange={e=>setFormProd({...formProd,qty:e.target.value})} placeholder="الكمية" className="input" required/><input type="date" value={formProd.date} onChange={e=>setFormProd({...formProd,date:e.target.value})} className="input"/><button className="btn btn-primary col-span-2 h-9">حفظ الإنتاج</button></form></div>
        )}

        {tab==="workers-info" && (
          <div className="card p-3">
            <div className="flex flex-wrap justify-between gap-2 mb-3"><h2 className="font-bold text-[12px]">معلومات العمال</h2><div className="flex gap-1.5"><button onClick={()=>exportExcel(workers.map(w=>({الاسم:w.name,الهاتف:w.phone,العنوان:w.address||""})),"قائمة_العمال")} className="btn btn-blue h-8 text-[10px]"><i className="fa-solid fa-download"></i>Excel</button><button onClick={()=>{setEditWorkerId(""); setNewWorker({name:"",phone:"",address:""}); setShowWorker(true)}} className="btn btn-primary h-8 text-[10px]"><i className="fa-solid fa-plus"></i>عامل</button></div></div>
            <div className="overflow-x-auto rounded-xl border"><table className="w-full"><thead><tr style={{background:"var(--card2)"}}><th className="th">#</th><th className="th">الاسم</th><th className="th">الهاتف</th><th className="th">العنوان</th><th className="th">إجراء</th></tr></thead><tbody>{workers.map((w,i)=><tr key={w.id} className="tr"><td data-label="#" className="td text-[10px]">{i+1}</td><td data-label="الاسم" className="td font-bold text-[11px]">{w.name}</td><td data-label="الهاتف" className="td font-mono text-blue-600 text-[10px]">{w.phone}</td><td data-label="العنوان" className="td text-[10px]">{w.address||"—"}</td><td data-label="إجراء" className="td"><div className="flex gap-1 justify-center"><button onClick={()=>{setEditWorkerId(w.id); setNewWorker({name:w.name,phone:w.phone||"",address:w.address||""}); setShowWorker(true)}} className="w-6 h-6 grid place-items-center rounded-md border bg-white"><i className="fa-solid fa-pen text-[9px]"></i></button><button onClick={()=>setConfirmDel({type:'workers', id:w.id, name:w.name})} className="w-6 h-6 grid place-items-center rounded-md bg-red-50 text-red-500 border"><i className="fa-solid fa-trash text-[9px]"></i></button></div></td></tr>)}</tbody></table></div>
          </div>
        )}
      </main>

      <div className="bottom-nav"><div className="bottom-inner">
        {[
          {id:"dashboard",title:"الرئيسية",icon:"fa-house"},
          {id:"inventory",title:"المخزن",icon:"fa-boxes-stacked"},
          {id:"stockout",title:"الخروج",icon:"fa-truck-fast"},
          {id:"attendance",title:"الحضور",icon:"fa-calendar-check"},
          {id:"archive",title:"الأرشيف",icon:"fa-calendar-days"},
        ].map(t=>{const active=tab===t.id; return <button key={t.id} onClick={()=>setTab(t.id)} className={`bottom-btn ${active?'active':''}`}><i className={`fa-solid ${t.icon}`}></i><span>{t.title}</span></button>})}
      </div></div>

      {showProd && (<div className="fixed inset-0 z-50 modal-bg grid place-items-center p-3"><form onSubmit={handleSaveProd} className="modal p-4 w-full max-w-[420px] space-y-2.5"><h3 className="font-bold text-[12px]">{editProdId?"تعديل المنتج":"منتج جديد"}</h3><input value={newProd.code} onChange={e=>setNewProd({...newProd,code:e.target.value})} placeholder="الكود #" className="input" required/><input value={newProd.desc} onChange={e=>setNewProd({...newProd,desc:e.target.value})} placeholder="وصف المنتج" className="input" required/><input value={newProd.unit} onChange={e=>setNewProd({...newProd,unit:e.target.value})} placeholder="الوحدة" className="input"/><div className="grid grid-cols-3 gap-1.5"><input type="number" value={newProd.boxes} onChange={e=>setNewProd({...newProd,boxes:e.target.value})} placeholder="العلب" className="input input-sm"/><input type="number" value={newProd.itemsPerBox} onChange={e=>setNewProd({...newProd,itemsPerBox:e.target.value})} placeholder="القطع/علبة" className="input input-sm"/><input type="number" value={newProd.minStock} onChange={e=>setNewProd({...newProd,minStock:e.target.value})} placeholder="الحد الأدنى" className="input input-sm" style={{background:"#fffbeb"}}/></div><div className="flex gap-1.5"><button className="btn btn-primary flex-1 h-9 text-[11px]">حفظ</button><button type="button" onClick={()=>setShowProd(false)} className="btn btn-slate flex-1 h-9 text-[11px]">إلغاء</button></div></form></div>)}
      {showWorker && (<div className="fixed inset-0 z-50 modal-bg grid place-items-center p-3"><form onSubmit={handleSaveWorker} className="modal p-4 w-full max-w-[380px] space-y-2.5"><h3 className="font-bold text-[12px]">بيانات العامل</h3><input value={newWorker.name} onChange={e=>setNewWorker({...newWorker,name:e.target.value})} placeholder="اسم العامل" className="input" required/><input value={newWorker.phone} onChange={e=>setNewWorker({...newWorker,phone:e.target.value})} placeholder="رقم الهاتف" className="input"/><input value={newWorker.address} onChange={e=>setNewWorker({...newWorker,address:e.target.value})} placeholder="عنوان السكن" className="input"/><div className="flex gap-1.5"><button className="btn btn-primary flex-1 h-9 text-[11px]">حفظ</button><button type="button" onClick={()=>setShowWorker(false)} className="btn btn-slate flex-1 h-9 text-[11px]">إلغاء</button></div></form></div>)}
      {showPass && (<div className="fixed inset-0 z-[60] modal-bg grid place-items-center p-3"><form onSubmit={handleChangePass} className="modal p-4 w-full max-w-[360px] space-y-2.5"><h3 className="font-bold text-[12px]">تغيير الباسورد</h3><input type="password" value={passForm.current} onChange={e=>setPassForm({...passForm,current:e.target.value})} placeholder="الحالية" className="input" required/><input type="password" value={passForm.newPass} onChange={e=>setPassForm({...passForm,newPass:e.target.value})} placeholder="الجديدة" className="input" required/><input type="password" value={passForm.confirm} onChange={e=>setPassForm({...passForm,confirm:e.target.value})} placeholder="تأكيد" className="input" required/><div className="flex gap-1.5"><button className="btn btn-primary flex-1 h-9 text-[11px]">تغيير</button><button type="button" onClick={()=>setShowPass(false)} className="btn btn-slate flex-1 h-9 text-[11px]">إلغاء</button></div></form></div>)}

      {confirmDel && (
        <div className="fixed inset-0 z-[70] modal-bg grid place-items-center p-3">
          <div className="modal p-5 w-full max-w-[360px] space-y-4 text-center">
            <div className="w-12 h-12 rounded-full bg-red-100 text-red-600 grid place-items-center mx-auto"><i className="fa-solid fa-triangle-exclamation text-[18px]"></i></div>
            <div><h3 className="font-black text-[13px]">تأكيد الحذف</h3><p className="text-[11px] text-slate-500 mt-2">هل أنت متأكد من حذف<br/><b className="text-slate-900" style={{color:"var(--text)"}}>{confirmDel.name}</b>؟</p></div>
            <div className="flex gap-2">
              <button onClick={async()=>{await db.collection(confirmDel.type).doc(confirmDel.id).delete(); notify("تم الحذف ✅"); setConfirmDel(null);}} className="btn bg-red-500 text-white flex-1 h-10 text-[11px]"><i className="fa-solid fa-trash"></i>نعم، احذف</button>
              <button onClick={()=>setConfirmDel(null)} className="btn btn-slate flex-1 h-10 text-[11px]">لا، تراجع</button>
            </div>
          </div>
        </div>
      )}

      {archiveDay && selectedDayData && (
        <div className="fixed inset-0 z-[70] modal-bg grid place-items-center p-3">
          <div className="modal w-full max-w-[540px] max-h-[85vh] overflow-y-auto p-4 space-y-3">
            <div className="flex justify-between items-center"><h3 className="font-black text-[14px]">📅 تفاصيل يوم {selectedDayData.iso}</h3><button onClick={()=>setArchiveDay(null)} className="w-8 h-8 grid place-items-center rounded-lg border"><i className="fa-solid fa-xmark"></i></button></div>
            
            <div className="grid grid-cols-3 gap-2">
              <div className="card p-2.5 text-center"><div className="text-[10px] text-slate-500 font-bold">إنتاج</div><div className="text-[18px] font-black text-emerald-600">{selectedDayData.prod.reduce((a,b)=>a+Number(b.qty),0)}</div><div className="text-[9px] text-slate-400">{selectedDayData.prod.length} عملية</div></div>
              <div className="card p-2.5 text-center"><div className="text-[10px] text-slate-500 font-bold">خروج</div><div className="text-[18px] font-black text-red-600">{selectedDayData.out.reduce((a,b)=>a+Number(b.qty),0)}</div><div className="text-[9px] text-slate-400">{selectedDayData.out.length} عملية</div></div>
              <div className="card p-2.5 text-center"><div className="text-[10px] text-slate-500 font-bold">حضور</div><div className="text-[18px] font-black text-blue-600">{Object.values(selectedDayData.att).filter(v=>v.includes("حاضر")).length}/{Object.keys(selectedDayData.att).length}</div><div className="text-[9px] text-slate-400">حاضر</div></div>
            </div>

            <div className="space-y-2.5">
              <div><h4 className="font-bold text-[11px] mb-1.5">👷 الحضور</h4><div className="space-y-1">{Object.keys(selectedDayData.att).length===0?<div className="text-[11px] text-slate-400 text-center py-3">لا يوجد حضور مسجل</div>:Object.entries(selectedDayData.att).map(([name,status])=><div key={name} className="flex justify-between items-center p-2 rounded-lg border text-[11px]"><span className="font-bold">{name}</span><span className={`badge ${status.includes("حاضر")?"badge-ok":status.includes("مريض")?"badge-warn":"badge-low"}`}>{status}</span></div>)}</div></div>

              <div><h4 className="font-bold text-[11px] mb-1.5">📦 الإنتاج</h4><div className="space-y-1">{selectedDayData.prod.length===0?<div className="text-[11px] text-slate-400 text-center py-3">لا يوجد إنتاج</div>:selectedDayData.prod.map(p=><div key={p.id} className="flex justify-between items-center p-2 rounded-lg border text-[11px]"><span><b>{p.worker}</b> - {p.code} ({p.desc})</span><span className="font-black">{p.qty}</span></div>)}</div></div>

              <div><h4 className="font-bold text-[11px] mb-1.5">🚚 الخروج</h4><div className="space-y-1">{selectedDayData.out.length===0?<div className="text-[11px] text-slate-400 text-center py-3">لا يوجد خروج</div>:selectedDayData.out.map(s=><div key={s.id} className="flex justify-between items-center p-2 rounded-lg border text-[11px]"><span>{s.code} - {s.desc}</span><span className="font-black">{s.qty}</span></div>)}</div></div>
            </div>

            <div className="flex gap-2">
              <button onClick={()=>{exportExcel([...selectedDayData.prod.map(p=>({النوع:"إنتاج",العامل:p.worker,الكود:p.code,الكمية:p.qty,التاريخ:p.date})), ...selectedDayData.out.map(s=>({النوع:"خروج",الكود:s.code,الكمية:s.qty,التاريخ:s.date})), ...Object.entries(selectedDayData.att).map(([n,st])=>({النوع:"حضور",العامل:n,الحالة:st,التاريخ:selectedDayData.iso}))], `تقرير_${selectedDayData.iso}`)}} className="btn btn-blue flex-1 h-9 text-[11px]"><i className="fa-solid fa-download"></i>تحميل تقرير اليوم Excel</button>
              <button onClick={()=>setArchiveDay(null)} className="btn btn-slate flex-1 h-9 text-[11px]">إغلاق</button>
            </div>
          </div>
        </div>
      )}

      <div className="fixed bottom-[72px] lg:bottom-4 right-2 left-2 lg:left-auto z-[50] flex flex-col gap-1.5 max-w-[320px]">{toasts.map(t=><div key={t.id} className={`px-3 py-2 rounded-xl text-white font-bold text-[10px] shadow-lg ${t.t==="err"?"bg-red-500":"bg-slate-900"}`}>{t.m}</div>)}</div>
    </div>
  )
}
const root=ReactDOM.createRoot(document.getElementById("root"));
root.render(<App/>);
</script>
</body>
</html>
