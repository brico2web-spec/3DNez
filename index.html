<script>const firebaseConfig={apiKey:"AIzaSyCmpOjdxAkJTL7uE9I_CazbQfh-qSbPnNQ",authDomain:"factory-system-a4db8.firebaseapp.com",projectId:"factory-system-a4db8",storageBucket:"factory-system-a4db8.firebasestorage.app",messagingSenderId:"216358094084",appId:"1:216358094084:web:500d511f7b130f23ecfc51"}; firebase.initializeApp(firebaseConfig); const db=firebase.firestore();</script>
<style>
*{font-family:'Cairo',sans-serif;box-sizing:border-box}
body{margin:0;background:#f6f7ff;color:#0f172a}
.card{background:#fff;border:1px solid #e0e3ff;border-radius:20px;box-shadow:0 8px 24px rgba(99,102,241,.08);padding:12px}
.input{width:100%;height:42px;padding:0 12px;border-radius:12px;border:1px solid #e0e3ff;background:#fff;font-weight:700;font-size:12px;outline:none}
.btn{height:36px;padding:0 14px;border-radius:12px;font-weight:800;font-size:11px;display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;border:1px solid transparent}
.btn-primary{background:#0f172a;color:#fff}
.btn-blue{background:#eff6ff;color:#2563eb;border-color:#bfdbfe}
.btn-emerald{background:#ecfdf5;color:#059669;border-color:#a7f3d0}
.badge{padding:3px 9px;border-radius:999px;font-size:10px;font-weight:800;display:inline-flex;gap:4px}
.badge-low{background:#fef2f2;color:#dc2626;border:1px solid #fecaca}
.badge-warn{background:#fffbeb;color:#d97706;border:1px solid #fde68a}
.badge-ok{background:#f0fdf4;color:#16a34a;border:1px solid #bbf7d0}
.modal-bg{backdrop-filter:blur(12px);background:rgba(15,23,42,.5);position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:12px}
.modal{background:#fff;border:1px solid #e0e3ff;border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,.3);padding:16px;width:100%;max-width:420px}
.bottom-nav{position:fixed;bottom:12px;left:12px;right:12px;z-index:40;display:flex;justify-content:center}
.bottom-inner{width:100%;max-width:460px;height:60px;background:rgba(255,255,255,.95);backdrop-filter:blur(20px);border:1px solid #e0e3ff;border-radius:20px;box-shadow:0 12px 32px rgba(0,0,0,.15);display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding:6px}
.bottom-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border-radius:14px;font-size:9px;font-weight:800;color:#64748b;border:none;background:transparent;cursor:pointer}
.bottom-btn.active{color:#fff;transform:translateY(-3px)}
.bottom-btn.dashboard.active{background:linear-gradient(135deg,#6366f1,#3b82f6)}
.bottom-btn.inventory.active{background:linear-gradient(135deg,#06b6d4,#0ea5e9)}
.bottom-btn.analytics.active{background:linear-gradient(135deg,#ec4899,#e11d48)}
.bottom-btn.attendance.active{background:linear-gradient(135deg,#8b5cf6,#a855f7)}
.bottom-btn.archive.active{background:linear-gradient(135deg,#f59e0b,#eab308)}
.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.calendar-day{min-height:70px;border-radius:12px;border:1px solid #e0e3ff;background:#fff;padding:6px;cursor:pointer}
.calendar-day.has-data{background:#eef2ff;border-color:#a5b4fc}
.calendar-day.today{outline:2px solid #6366f1}
.calendar-day.empty{background:transparent;border:none;cursor:default}
.th{font-size:10px;font-weight:900;color:#64748b;padding:10px 8px;border-bottom:1px solid #e0e3ff;text-align:right}
.td{padding:10px 8px;border-bottom:1px solid #e0e3ff;font-size:11px}
</style>

<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="text/babel">
const {useState,useEffect,useRef} = React;
function App(){
  const [theme,setTheme]=useState("light");
  const [logged,setLogged]=useState(localStorage.getItem("factory_logged")==="1");
  const [tab,setTab]=useState("dashboard");
  const [products,setProducts]=useState([]);
  const [production,setProduction]=useState([]);
  const [stockOut,setStockOut]=useState([]);
  const [workers,setWorkers]=useState([]);
  const [attendance,setAttendance]=useState({});
  const [toasts,setToasts]=useState([]);
  const [showProd,setShowProd]=useState(false);
  const [showWorker,setShowWorker]=useState(false);
  const [showPass,setShowPass]=useState(false);
  const [confirmDel,setConfirmDel]=useState(null);
  const [archiveDay,setArchiveDay]=useState(null);
  const [archiveMonth,setArchiveMonth]=useState(new Date());
  const [editProdId,setEditProdId]=useState("");
  const [editWorkerId,setEditWorkerId]=useState("");
  const [attDate,setAttDate]=useState(new Date().toISOString().split('T')[0]);
  const [search,setSearch]=useState("");
  const [formProd,setFormProd]=useState({worker:"",productRaw:"",qty:"",date:new Date().toISOString().split('T')[0]});
  const [formOut,setFormOut]=useState({productRaw:"",qty:"",date:new Date().toISOString().split('T')[0]});
  const [newProd,setNewProd]=useState({code:"",desc:"",unit:"550 ml",boxes:0,itemsPerBox:20,minStock:10,qty:0});
  const [newWorker,setNewWorker]=useState({name:"",phone:"",address:""});
  const [prodList,setProdList]=useState([{id:1, productRaw:"", qty:""}]);
  const [prodNote,setProdNote]=useState("");
  const [attForm,setAttForm]=useState({});
  const [passForm,setPassForm]=useState({current:"",newPass:"",confirm:""});
  const tid=useRef(0);
  const notify=(m,t="ok")=>{const id=++tid.current; setToasts(v=>[...v,{id,m,t}]); setTimeout(()=>setToasts(v=>v.filter(x=>x.id!==id)),3000)};

  useEffect(()=>{
    const u1=db.collection("products").onSnapshot(s=>setProducts(s.docs.map(d=>({id:d.id,...d.data()}))));
    const u2=db.collection("workers").onSnapshot(s=>setWorkers(s.docs.map(d=>({id:d.id,...d.data()}))));
    const u3=db.collection("productionLogs").orderBy("createdAt","desc").limit(1000).onSnapshot(s=>setProduction(s.docs.map(d=>({id:d.id,...d.data()}))));
    const u4=db.collection("stockOutLogs").orderBy("createdAt","desc").limit(1000).onSnapshot(s=>setStockOut(s.docs.map(d=>({id:d.id,...d.data()}))));
    const u5=db.collection("attendanceLogs").onSnapshot(s=>{const o={}; s.docs.forEach(d=>o[d.id]=d.data().records||{}); setAttendance(o)});
    return ()=>{u1();u2();u3();u4();u5();};
  },[]);

  useEffect(()=>{
    const rec=attendance[attDate]||{};
    const init={}; workers.forEach(w=>{init[w.name]=rec[w.name]||"حاضر"});
    setAttForm(init);
  },[attDate,attendance,workers]);

  const stockOf=(code)=>{
    const base=products.find(p=>p.code===code);
    const baseQty=base ? Number(base.qty||0) : 0;
    const pr=production.filter(p=>p.code===code).reduce((a,b)=>a+Number(b.qty||0),0);
    const out=stockOut.filter(p=>p.code===code).reduce((a,b)=>a+Number(b.qty||0),0);
    return baseQty+pr-out;
  };
  const getMin=(code)=>{
    const p=products.find(x=>x.code===code);
    return p ? Number(p.minStock||10) : 10;
  };
  const low=products.filter(p=>{const cur=stockOf(p.code); const mn=getMin(p.code); return cur<=mn*1.3});
  const critical=products.filter(p=>stockOf(p.code)<=getMin(p.code));
  const todayProd=production.filter(p=>p.date===new Date().toISOString().split('T')[0]);
  const filtProducts=products.filter(p=>{const s=(p.code+" "+p.desc).toLowerCase(); return s.includes(search.toLowerCase())});
  const outByProduct={}; stockOut.forEach(p=>{outByProduct[p.code]=(outByProduct[p.code]||0)+Number(p.qty)});
  const prodByWorker={}; production.forEach(p=>{prodByWorker[p.worker]=(prodByWorker[p.worker]||0)+Number(p.qty)});
  const mostConsumed=Object.entries(outByProduct).sort((a,b)=>b[1]-a[1]).slice(0,8);

  const exportExcel=(data,fileName)=>{
    if(!data || data.length===0){notify("لا يوجد بيانات","err"); return;}
    const ws=XLSX.utils.json_to_sheet(data);
    const wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,ws,"Data");
    XLSX.writeFile(wb,fileName+".xlsx");
    notify("تم التحميل ✅");
  };

  const getDaysInMonth=(date)=>{
    const year=date.getFullYear(); const month=date.getMonth();
    const firstDay=new Date(year,month,1).getDay();
    const daysInMonth=new Date(year,month+1,0).getDate();
    const days=[];
    const startOffset=(firstDay+6)%7;
    for(let i=0;i<startOffset;i++){days.push(null);}
    for(let d=1; d<=daysInMonth; d++){
      const iso=year+"-"+String(month+1).padStart(2,'0')+"-"+String(d).padStart(2,'0');
      const prod=production.filter(p=>p.date===iso);
      const out=stockOut.filter(p=>p.date===iso);
      const att=attendance[iso]||{};
      const presentCount=Object.values(att).filter(v=>v && v.includes("حاضر")).length;
      days.push({day:d, iso, prod, out, att, presentCount});
    }
    return days;
  };

  const handleLogin=(e)=>{
    e.preventDefault();
    const u=document.getElementById("u").value.trim();
    const pw=document.getElementById("pw").value.trim();
    const saved=localStorage.getItem("admin_pass")||"admin123";
    if(u==="admin" && pw===saved){setLogged(true); localStorage.setItem("factory_logged","1"); notify("مرحبا 👋");}
    else {document.getElementById("err").style.display="block";}
  };
  const handleChangePass=(e)=>{
    e.preventDefault();
    const saved=localStorage.getItem("admin_pass")||"admin123";
    if(passForm.current!==saved){notify("الحالية خاطئة","err"); return;}
    if(passForm.newPass!==passForm.confirm){notify("التأكيد غير مطابق","err"); return;}
    localStorage.setItem("admin_pass",passForm.newPass);
    setShowPass(false); notify("تم تغيير الباسورد ✅");
  };
  const handleSaveProd=async(e)=>{
    e.preventDefault();
    const code=newProd.code.toUpperCase().trim();
    if(!code){notify("أدخل الكود","err"); return;}
    const calcQty=Number(newProd.boxes)*Number(newProd.itemsPerBox);
    const finalQty=calcQty>0?calcQty:Number(newProd.qty)||0;
    const data={code,desc:newProd.desc,unit:newProd.unit,boxes:Number(newProd.boxes),itemsPerBox:Number(newProd.itemsPerBox),qty:finalQty,minStock:Number(newProd.minStock||10)};
    if(editProdId){await db.collection("products").doc(editProdId).update(data); notify("تم التحديث");}
    else {await db.collection("products").add(Object.assign({},data,{createdAt:new Date()})); notify("تمت الإضافة");}
    setShowProd(false); setEditProdId("");
  };
  const handleSaveWorker=async(e)=>{
    e.preventDefault();
    if(!newWorker.name){notify("الاسم مطلوب","err"); return;}
    if(editWorkerId){await db.collection("workers").doc(editWorkerId).update(newWorker);}
    else {await db.collection("workers").add(Object.assign({},newWorker,{createdAt:new Date()}));}
    setShowWorker(false); notify("تم الحفظ");
  };
  const handleProdMulti=async(e)=>{
    e.preventDefault();
    if(!formProd.worker){notify("اختر العامل","err"); return;}
    let saved=0;
    for(const item of prodList){
      const code=item.productRaw.split(" - ")[0].trim().toUpperCase();
      const p=products.find(x=>x.code===code);
      if(!p) continue;
      const qty=Number(item.qty)||0;
      if(qty<=0) continue;
      await db.collection("productionLogs").add({date:formProd.date, worker:formProd.worker, code:p.code, desc:p.desc, qty:qty, notes:prodNote, createdAt:new Date()});
      saved++;
    }
    if(saved>0){notify("تم حفظ "+saved+" منتوج ✅"); setProdList([{id:Date.now(), productRaw:"", qty:""}]); setProdNote("");} else {notify("أدخل منتوج صحيح","err");}
  };
  const handleProd=async(e)=>{
    e.preventDefault();
    const code=formProd.productRaw.split(" - ")[0].trim().toUpperCase();
    const p=products.find(x=>x.code===code);
    if(!p){notify("منتج غير صحيح","err"); return;}
    await db.collection("productionLogs").add({date:formProd.date,worker:formProd.worker,code:p.code,desc:p.desc,qty:Number(formProd.qty),createdAt:new Date()});
    setFormProd({worker:"",productRaw:"",qty:"",date:formProd.date}); notify("تم التسجيل");
  };
  const handleOut=async(e)=>{
    e.preventDefault();
    const code=formOut.productRaw.split(" - ")[0].trim().toUpperCase();
    const p=products.find(x=>x.code===code);
    if(!p){notify("منتج غير صحيح","err"); return;}
    if(Number(formOut.qty)>stockOf(code)){notify("المخزون غير كافي","err"); return;}
    await db.collection("stockOutLogs").add({date:formOut.date,code:p.code,desc:p.desc,qty:Number(formOut.qty),createdAt:new Date()});
    setFormOut({productRaw:"",qty:"",date:formOut.date}); notify("تم الخروج");
  };
  const handleAtt=async(e)=>{
    e.preventDefault();
    await db.collection("attendanceLogs").doc(attDate).set({date:attDate,records:attForm,updatedAt:new Date()},{merge:true});
    notify("تم حفظ الحضور");
  };

  if(!logged){
    return (
      <div className="min-h-screen grid place-items-center p-4">
        <div className="w-full max-w-[360px] card">
          <div className="flex items-center gap-3 mb-5">
            <div className="w-12 h-12 rounded-2xl bg-gradient-to-br from-violet-600 via-blue-600 to-cyan-500 grid place-items-center text-white"><i className="fa-solid fa-database"></i></div>
            <div><div className="font-black text-[13px]">DATA BASE <span className="bg-amber-400 text-white text-[9px] px-1.5 py-0.5 rounded-md">3D-NEZAR</span></div><div className="text-[10px] text-slate-500 font-bold">نظام المصنع</div></div>
          </div>
          <form onSubmit={handleLogin} className="space-y-2.5">
            <input id="u" className="input" placeholder="admin" required/>
            <input id="pw" type="password" className="input" placeholder="كلمة المرور" required/>
            <div id="err" style={{display:"none"}} className="bg-red-500 text-white rounded-xl p-2 text-[10px] font-black text-center">خطأ في الدخول</div>
            <button className="btn btn-primary w-full h-10">دخول</button>
          </form>
        </div>
      </div>
    );
  }

  return (
    <div>
      <header className="sticky top-0 z-30 border-b backdrop-blur-xl bg-white/90" style={{borderColor:"#e0e3ff"}}>
        <div className="mx-auto max-w-[1440px] px-3 h-[58px] flex items-center justify-between gap-2">
          <div className="flex items-center gap-2.5">
            <div className="w-9 h-9 rounded-xl bg-gradient-to-br from-violet-600 via-blue-600 to-cyan-500 grid place-items-center text-white shadow-lg"><i className="fa-solid fa-database text-[13px]"></i></div>
            <div className="leading-none">
              <div className="font-black text-[13px] flex items-center gap-1.5"><span className="bg-gradient-to-r from-violet-600 to-blue-600 bg-clip-text text-transparent">DATA BASE</span><span className="px-2 py-0.5 rounded-lg bg-gradient-to-r from-amber-400 to-orange-500 text-white text-[9px] font-black">3D-NEZAR</span></div>
              <div className="text-[9px] font-bold text-slate-500 mt-1">{tab} • Live</div>
            </div>
          </div>
          <div className="flex items-center gap-1.5">
            <button onClick={()=>setShowPass(true)} className="w-8 h-8 grid place-items-center rounded-xl border bg-amber-50 text-amber-600"><i className="fa-solid fa-key text-[11px]"></i></button>
            <button onClick={()=>{localStorage.removeItem("factory_logged"); setLogged(false)}} className="w-8 h-8 grid place-items-center rounded-xl border bg-white text-red-500"><i className="fa-solid fa-right-from-bracket text-[11px]"></i></button>
          </div>
        </div>
      </header>

      <main className="mx-auto max-w-[1440px] px-3 py-4 pb-[90px]">
        {tab==="dashboard" && (
          <div className="space-y-3">
            <div className="flex justify-between items-center"><h2 className="font-black text-[13px]"><i className="fa-solid fa-gauge-high ml-1"></i>الرئيسية</h2><button onClick={()=>exportExcel([{التاريخ:new Date().toISOString().split('T')[0], المنتجات:products.length, انتاج_اليوم:todayProd.reduce((a,b)=>a+Number(b.qty),0), الاكثر_استهلاكا:mostConsumed[0]?mostConsumed[0][0]:"-", تنبيهات:critical.length}], "معلومات_الرئيسية")} className="btn btn-blue h-8 text-[10px]"><i className="fa-solid fa-download"></i>تحميل معلومات الرئيسية</button></div>
            <div className="grid grid-cols-2 lg:grid-cols-4 gap-3">
              <div className="card" style={{background:"linear-gradient(135deg,#eff6ff,#dbeafe)",borderColor:"#bfdbfe"}}><div className="flex justify-between"><span className="text-[10px] font-black text-blue-700">📦 المخزون</span><div className="w-8 h-8 rounded-xl bg-blue-600 text-white grid place-items-center"><i className="fa-solid fa-boxes-stacked text-[11px]"></i></div></div><div className="text-[26px] font-black text-blue-900 mt-1">{products.length}</div><div className="text-[10px] text-blue-600 font-bold">{products.length-critical.length} متوفر</div></div>
              <div className="card" style={{background:"linear-gradient(135deg,#f0fdf4,#dcfce7)",borderColor:"#bbf7d0"}}><div className="flex justify-between"><span className="text-[10px] font-black text-emerald-700">🏭 إنتاج اليوم</span><div className="w-8 h-8 rounded-xl bg-emerald-600 text-white grid place-items-center"><i className="fa-solid fa-industry text-[11px]"></i></div></div><div className="text-[26px] font-black text-emerald-900 mt-1">{todayProd.reduce((a,b)=>a+Number(b.qty),0)}</div><div className="text-[10px] text-emerald-600 font-bold">{todayProd.length} عملية</div></div>
              <div className="card" style={{background:"linear-gradient(135deg,#fef2f2,#fee2e2)",borderColor:"#fecaca"}}><div className="flex justify-between"><span className="text-[10px] font-black text-red-700">🔥 الأكثر استهلاكا</span><div className="w-8 h-8 rounded-xl bg-red-600 text-white grid place-items-center"><i className="fa-solid fa-fire text-[11px]"></i></div></div><div className="text-[13px] font-black text-red-900 truncate mt-1">{mostConsumed[0]?mostConsumed[0][0]:"-"}</div><div className="text-[10px] text-red-600 font-bold">{mostConsumed[0]?mostConsumed[0][1]:0} وحدة</div></div>
              <div className="card" style={{background:critical.length?"linear-gradient(135deg,#fef2f2,#fecaca)":"linear-gradient(135deg,#fffbeb,#fef3c7)",borderColor:critical.length?"#fecaca":"#fde68a"}}><div className="flex justify-between"><span className="text-[10px] font-black" style={{color:critical.length?"#991b1b":"#92400e"}}>⚠️ تنبيه</span><div className="w-8 h-8 rounded-xl bg-red-600 text-white grid place-items-center"><i className="fa-solid fa-bell text-[11px]"></i></div></div><div className="text-[26px] font-black mt-1" style={{color:critical.length?"#991b1b":"#92400e"}}>{critical.length}</div><div className="text-[10px] font-bold" style={{color:critical.length?"#dc2626":"#d97706"}}>{low.length} قريب</div></div>
            </div>
            {low.length>0 && (
              <div className="card"><h3 className="font-black text-[12px] mb-2">⚠️ تنبيهات نفاد</h3><div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-2">{low.map(p=>{const cur=stockOf(p.code); return <div key={p.id} className="p-2 rounded-xl border bg-white flex justify-between items-center"><div><div className="font-mono font-black text-[11px]">{p.code}</div><div className="text-[10px] font-bold">{p.desc}</div></div><div className="w-8 h-8 rounded-full bg-red-500 text-white grid place-items-center font-black text-[11px]">{cur}</div></div>})}</div></div>
            )}
          </div>
        )}

        {tab==="inventory" && (
          <div className="space-y-3">
            <div className="flex flex-wrap justify-between gap-2 items-center"><h2 className="font-black text-[13px]"><i className="fa-solid fa-boxes-stacked ml-1 text-cyan-600"></i>المخزن</h2><div className="flex gap-1.5"><input value={search} onChange={e=>setSearch(e.target.value)} placeholder="بحث..." className="input h-8 w-[110px] text-[11px]"/><button onClick={()=>exportExcel(products.map(p=>({الكود:p.code, الوصف:p.desc, الحالي:stockOf(p.code), الادنى:getMin(p.code), الحالة:stockOf(p.code)<=getMin(p.code)?"نفد":stockOf(p.code)<=getMin(p.code)*1.3?"قريب":"متوفر"})), "معلومات_المخزن")} className="btn btn-blue h-8 text-[10px]"><i className="fa-solid fa-download"></i>تحميل معلومات المخزن</button><button onClick={()=>{setEditProdId(""); setNewProd({code:"",desc:"",unit:"550 ml",boxes:0,itemsPerBox:20,minStock:10,qty:0}); setShowProd(true)}} className="btn btn-primary h-8 text-[10px]"><i className="fa-solid fa-plus"></i>جديد</button></div></div>

          <div className="space-y-3">
            <div className="flex justify-between items-center"><h2 className="font-black text-[13px]"><i className="fa-solid fa-truck-fast ml-1 text-red-600"></i>الخروج</h2><button onClick={()=>exportExcel(stockOut.map(s=>({التاريخ:s.date, الكود:s.code, الوصف:s.desc, الكمية:s.qty})), "معلومات_الخروج")} className="btn btn-blue h-8 text-[10px]"><i className="fa-solid fa-download"></i>تحميل معلومات الخروج</button></div>
            <div className="card"><form onSubmit={handleOut} className="grid grid-cols-2 gap-2"><input list="olist" value={formOut.productRaw} onChange={e=>setFormOut(Object.assign({},formOut,{productRaw:e.target.value}))} placeholder="📦 اختر المنتج" className="input col-span-2" required/><datalist id="olist">{products.map(p=><option key={p.id} value={p.code+" - "+p.desc+" | متاح: "+stockOf(p.code)} />)}</datalist><input type="number" value={formOut.qty} onChange={e=>setFormOut(Object.assign({},formOut,{qty:e.target.value}))} placeholder="الكمية" className="input" required/><input type="date" value={formOut.date} onChange={e=>setFormOut(Object.assign({},formOut,{date:e.target.value}))} className="input"/><button className="btn col-span-2 h-10 text-white" style={{background:"linear-gradient(135deg,#ef4444,#f97316)"}}><i className="fa-solid fa-paper-plane"></i> تأكيد الخروج</button></form></div>
          </div>
        )}

      </main>

      <div className="bottom-nav"><div className="bottom-inner">
        <button onClick={()=>setTab("dashboard")} className={`bottom-btn dashboard ${tab==="dashboard"?"active":""}`}><i className="fa-solid fa-house"></i><span>الرئيسية</span></button>
        <button onClick={()=>setTab("inventory")} className={`bottom-btn inventory ${tab==="inventory"?"active":""}`}><i className="fa-solid fa-boxes-stacked"></i><span>المخزن</span></button>
        <button onClick={()=>setTab("analytics")} className={`bottom-btn analytics ${tab==="analytics"?"active":""}`}><i className="fa-solid fa-chart-line"></i><span>التحليل</span></button>
        <button onClick={()=>setTab("attendance")} className={`bottom-btn attendance ${tab==="attendance"?"active":""}`}><i className="fa-solid fa-calendar-check"></i><span>الحضور</span></button>
        <button onClick={()=>setTab("archive")} className={`bottom-btn archive ${tab==="archive"?"active":""}`}><i className="fa-solid fa-calendar-days"></i><span>الأرشيف</span></button>
      </div></div>

      {showProd && (<div className="modal-bg"><form onSubmit={handleSaveProd} className="modal space-y-2.5"><h3 className="font-black text-[12px]"><i className="fa-solid fa-box ml-1"></i>{editProdId?"تعديل المنتج":"منتج جديد"}</h3><input value={newProd.code} onChange={e=>setNewProd(Object.assign({},newProd,{code:e.target.value}))} placeholder="الكود #" className="input" required/><input value={newProd.desc} onChange={e=>setNewProd(Object.assign({},newProd,{desc:e.target.value}))} placeholder="وصف المنتج" className="input" required/><input value={newProd.unit} onChange={e=>setNewProd(Object.assign({},newProd,{unit:e.target.value}))} placeholder="الوحدة" className="input"/><div className="grid grid-cols-3 gap-1.5"><input type="number" value={newProd.boxes} onChange={e=>setNewProd(Object.assign({},newProd,{boxes:e.target.value}))} placeholder="العلب" className="input"/><input type="number" value={newProd.itemsPerBox} onChange={e=>setNewProd(Object.assign({},newProd,{itemsPerBox:e.target.value}))} placeholder="القطع/علبة" className="input"/><input type="number" value={newProd.minStock} onChange={e=>setNewProd(Object.assign({},newProd,{minStock:e.target.value}))} placeholder="الحد الأدنى" className="input" style={{background:"#fffbeb"}}/></div><div className="flex gap-1.5"><button className="btn btn-primary flex-1 h-9">حفظ</button><button type="button" onClick={()=>setShowProd(false)} className="btn btn-slate flex-1 h-9">إلغاء</button></div></form></div>)}
      {showWorker && (<div className="modal-bg"><form onSubmit={handleSaveWorker} className="modal space-y-2.5"><h3 className="font-black text-[12px]">بيانات العامل</h3><input value={newWorker.name} onChange={e=>setNewWorker(Object.assign({},newWorker,{name:e.target.value}))} placeholder="اسم العامل" className="input" required/><input value={newWorker.phone} onChange={e=>setNewWorker(Object.assign({},newWorker,{phone:e.target.value}))} placeholder="رقم الهاتف" className="input"/><input value={newWorker.address} onChange={e=>setNewWorker(Object.assign({},newWorker,{address:e.target.value}))} placeholder="عنوان السكن" className="input"/><div className="flex gap-1.5"><button className="btn btn-primary flex-1 h-9">حفظ</button><button type="button" onClick={()=>setShowWorker(false)} className="btn btn-slate flex-1 h-9">إلغاء</button></div></form></div>)}
      {showPass && (<div className="modal-bg"><form onSubmit={handleChangePass} className="modal space-y-2.5"><h3 className="font-black text-[12px]">تغيير الباسورد</h3><input type="password" value={passForm.current} onChange={e=>setPassForm(Object.assign({},passForm,{current:e.target.value}))} placeholder="الحالية" className="input" required/><input type="password" value={passForm.newPass} onChange={e=>setPassForm(Object.assign({},passForm,{newPass:e.target.value}))} placeholder="الجديدة" className="input" required/><input type="password" value={passForm.confirm} onChange={e=>setPassForm(Object.assign({},passForm,{confirm:e.target.value}))} placeholder="تأكيد" className="input" required/><div className="flex gap-1.5"><button className="btn btn-primary flex-1 h-9">تغيير</button><button type="button" onClick={()=>setShowPass(false)} className="btn btn-slate flex-1 h-9">إلغاء</button></div></form></div>)}
      {confirmDel && (<div className="modal-bg" style={{zIndex:70}}><div className="modal text-center space-y-4"><div className="w-12 h-12 rounded-full bg-red-100 text-red-600 grid place-items-center mx-auto"><i className="fa-solid fa-triangle-exclamation text-[18px]"></i></div><div><h3 className="font-black text-[13px]">تأكيد الحذف</h3><p className="text-[11px] text-slate-500 mt-2">هل أنت متأكد من حذف <b>{confirmDel.name}</b>؟</p></div><div className="flex gap-2"><button onClick={async()=>{await db.collection(confirmDel.type).doc(confirmDel.id).delete(); notify("تم الحذف ✅"); setConfirmDel(null);}} className="btn bg-red-500 text-white flex-1 h-10"><i className="fa-solid fa-trash"></i>نعم، احذف</button><button onClick={()=>setConfirmDel(null)} className="btn btn-slate flex-1 h-10">لا، تراجع</button></div></div></div>)}
      {archiveDay && (<div className="modal-bg" style={{zIndex:70}}><div className="modal max-h-[85vh] overflow-y-auto space-y-3" style={{maxWidth:"540px"}}><div className="flex justify-between items-center"><h3 className="font-black text-[14px]">📅 تفاصيل يوم {archiveDay.iso}</h3><button onClick={()=>setArchiveDay(null)} className="w-8 h-8 grid place-items-center rounded-xl border"><i className="fa-solid fa-xmark"></i></button></div><div className="grid grid-cols-3 gap-2"><div className="card p-2.5 text-center" style={{background:"linear-gradient(135deg,#f0fdf4,#dcfce7)"}}><div className="text-[10px] font-bold text-emerald-700">إنتاج</div><div className="text-[18px] font-black text-emerald-700">{archiveDay.prod.reduce((a,b)=>a+Number(b.qty),0)}</div></div><div className="card p-2.5 text-center" style={{background:"linear-gradient(135deg,#fef2f2,#fee2e2)"}}><div className="text-[10px] font-bold text-red-700">خروج</div><div className="text-[18px] font-black text-red-700">{archiveDay.out.reduce((a,b)=>a+Number(b.qty),0)}</div></div><div className="card p-2.5 text-center" style={{background:"linear-gradient(135deg,#eff6ff,#dbeafe)"}}><div className="text-[10px] font-bold text-blue-700">حضور</div><div className="text-[18px] font-black text-blue-700">{archiveDay.presentCount}/{Object.keys(archiveDay.att).length}</div></div></div><button onClick={()=>exportExcel([...archiveDay.prod.map(p=>({النوع:"إنتاج", العامل:p.worker, الكود:p.code, الكمية:p.qty})), ...archiveDay.out.map(s=>({النوع:"خروج", الكود:s.code, الكمية:s.qty})), ...Object.entries(archiveDay.att).map(([n,s])=>({النوع:"حضور", العامل:n, الحالة:s}))], "معلومات_يوم_"+archiveDay.iso)} className="btn btn-blue w-full h-9"><i className="fa-solid fa-download"></i>تحميل معلومات هذا اليوم</button><button onClick={()=>setArchiveDay(null)} className="btn btn-slate w-full h-9">إغلاق</button></div></div>)}

      <div className="fixed bottom-[78px] lg:bottom-4 right-2 left-2 lg:left-auto z-[50] flex flex-col gap-1.5 max-w-[320px]">{toasts.map(t=><div key={t.id} className={`px-3 py-2 rounded-xl text-white font-bold text-[10px] shadow-lg ${t.t==="err"?"bg-red-500":"bg-slate-900"}`}>{t.m}</div>)}</div>
    </div>
  );
}
const root=ReactDOM.createRoot(document.getElementById("root"));
root.render(<App/>);
</script>
</body>
</html>
