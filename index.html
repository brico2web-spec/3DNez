<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام تسيير الإنتاج والتخزين</title>
    <!-- Font Awesome للأيقونات -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-header: #0f172a;
            --bg-card: #1e293b;
            --primary-green: #10b981;
            --primary-green-hover: #059669;
            --danger-red: #ef4444;
            --warning-orange: #f59e0b;
            --text-light: #f8fafc;
            --text-dark: #1e293b;
            --border-color: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f1f5f9;
            color: var(--text-dark);
            direction: rtl;
        }

        /* الهيدر العلوي */
        header {
            background-color: var(--bg-header);
            color: var(--text-light);
            padding: 20px 15px;
            text-align: center;
            border-bottom: 3px solid var(--primary-green);
        }

        .header-title {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-size: 1.4rem;
            margin-bottom: 5px;
        }

        .header-title i {
            background-color: var(--primary-green);
            padding: 8px;
            border-radius: 8px;
            color: white;
        }

        .header-subtitle {
            font-size: 0.85rem;
            color: #94a3b8;
        }

        /* بار التحكم والأزرار */
        .controls-bar {
            background-color: var(--bg-card);
            padding: 15px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: space-between;
            align-items: center;
            color: white;
        }

        .btn {
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.9rem;
            transition: all 0.2s;
        }

        .btn-green {
            background-color: var(--primary-green);
            color: white;
        }

        .btn-green:hover {
            background-color: var(--primary-green-hover);
        }

        .btn-blue {
            background-color: #3b82f6;
            color: white;
        }

        .btn-blue:hover {
            background-color: #2563eb;
        }

        .btn-edit {
            background-color: #f59e0b;
            color: white;
            padding: 4px 8px;
            font-size: 0.8rem;
        }

        .btn-delete {
            background-color: var(--danger-red);
            color: white;
            padding: 4px 8px;
            font-size: 0.8rem;
        }

        .date-badge {
            background-color: #334155;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
        }

        /* الحاوية الرئيسية والجدول */
        .main-container {
            max-width: 800px;
            margin: 20px auto;
            padding: 0 10px;
        }

        .action-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .table-responsive {
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
        }

        th {
            background-color: #f8fafc;
            color: #475569;
            padding: 12px 8px;
            font-weight: bold;
            font-size: 0.9rem;
            border-bottom: 2px solid var(--border-color);
        }

        td {
            padding: 12px 8px;
            border-bottom: 1px solid var(--border-color);
            vertical-align: middle;
            font-size: 0.9rem;
        }

        /* أشكال الشارات/البطاقات داخل الجدول */
        .badge-num {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 6px;
            font-weight: bold;
        }

        .num-green {
            background-color: #ecfdf5;
            color: #10b981;
        }

        .num-red {
            background-color: #fef2f2;
            color: #ef4444;
        }

        .num-dark {
            background-color: #0f172a;
            color: white;
            border-radius: 6px;
            padding: 6px 12px;
        }

        .status-badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.8rem;
            display: inline-block;
        }

        .status-available {
            background-color: #d1fae5;
            color: #065f46;
        }

        .status-low {
            background-color: #fee2e2;
            color: #991b1b;
        }

        /* النافذة المنبثقة (Modal) */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: white;
            padding: 20px;
            border-radius: 10px;
            width: 90%;
            max-width: 400px;
        }

        .modal-header {
            font-weight: bold;
            margin-bottom: 15px;
            font-size: 1.1rem;
        }

        .form-group {
            margin-bottom: 12px;
            text-align: right;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 0.85rem;
            color: #475569;
        }

        .form-group input {
            width: 100%;
            padding: 8px;
            border: 1px solid var(--border-color);
            border-radius: 5px;
            outline: none;
        }

        .modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <!-- الهيدر العلوي -->
    <header>
        <div class="header-title">
            <i class="fa-solid fa-industry"></i>
            <span>نظام تسيير الإنتاج والتخزين</span>
        </div>
        <div class="header-subtitle">إدارة المخزون ومتابعة الإنتاج الحضور والعمال (Firebase Cloud)</div>
    </header>

    <!-- بار التحكم -->
    <div class="controls-bar">
        <span class="date-badge">التاريخ: <span id="current-date">11-09-2026</span></span>
        <button class="btn btn-green"><i class="fa-solid fa-file-excel"></i> تصدير الشامل</button>
    </div>

    <!-- المحتوى الرئيسي -->
    <div class="main-container">
        
        <div class="action-header">
            <button class="btn btn-green" onclick="openModal()"><i class="fa-solid fa-plus"></i> تحميل إكسيل / إضافة منتج</button>
        </div>

        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th>المُنتج</th>
                        <th>المُصرّف</th>
                        <th>المخزون الحالي</th>
                        <th>الحالة</th>
                        <th>الإجراءات</th> <!-- العمـــود الجديـــد -->
                    </tr>
                </thead>
                <tbody id="inventory-table">
                    <!-- الصف الأول -->
                    <tr>
                        <td><span class="badge-num num-green">0</span></td>
                        <td><span class="badge-num num-red">0</span></td>
                        <td><span class="num-dark">30</span></td>
                        <td><span class="status-badge status-available">متوفر</span></td>
                        <td>
                            <button class="btn btn-edit" onclick="editRow(this)"><i class="fa-solid fa-pen"></i></button>
                            <button class="btn btn-delete" onclick="deleteRow(this)"><i class="fa-solid fa-trash"></i></button>
                        </td>
                    </tr>
                    <!-- الصف الثاني -->
                    <tr>
                        <td><span class="badge-num num-green">0</span></td>
                        <td><span class="badge-num num-red">0</span></td>
                        <td><span class="num-dark">20</span></td>
                        <td><span class="status-badge status-available">متوفر</span></td>
                        <td>
                            <button class="btn btn-edit" onclick="editRow(this)"><i class="fa-solid fa-pen"></i></button>
                            <button class="btn btn-delete" onclick="deleteRow(this)"><i class="fa-solid fa-trash"></i></button>
                        </td>
                    </tr>
                    <!-- الصف الثالث -->
                    <tr>
                        <td><span class="badge-num num-green">0</span></td>
                        <td><span class="badge-num num-red">0</span></td>
                        <td><span class="num-dark">20</span></td>
                        <td><span class="status-badge status-available">متوفر</span></td>
                        <td>
                            <button class="btn btn-edit" onclick="editRow(this)"><i class="fa-solid fa-pen"></i></button>
                            <button class="btn btn-delete" onclick="deleteRow(this)"><i class="fa-solid fa-trash"></i></button>
                        </td>
                    </tr>
                    <!-- الصف الرابع -->
                    <tr>
                        <td><span class="badge-num num-green">0</span></td>
                        <td><span class="badge-num num-red">0</span></td>
                        <td><span class="num-dark">5</span></td>
                        <td><span class="status-badge status-low">منخفض جداً</span></td>
                        <td>
                            <button class="btn btn-edit" onclick="editRow(this)"><i class="fa-solid fa-pen"></i></button>
                            <button class="btn btn-delete" onclick="deleteRow(this)"><i class="fa-solid fa-trash"></i></button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- نافذة إضافة / تعديل منتج (Modal) -->
    <div class="modal" id="productModal">
        <div class="modal-content">
            <div class="modal-header" id="modalTitle">إضافة عنصر جديد</div>
            <div class="form-group">
                <label>المنتج (العدد)</label>
                <input type="number" id="inp-product" value="0">
            </div>
            <div class="form-group">
                <label>المُصرّف</label>
                <input type="number" id="inp-dispatched" value="0">
            </div>
            <div class="form-group">
                <label>المخزون الحالي</label>
                <input type="number" id="inp-stock" value="10">
            </div>
            <div class="modal-footer">
                <button class="btn btn-blue" onclick="saveProduct()">حفظ</button>
                <button class="btn btn-delete" onclick="closeModal()">إلغاء</button>
            </div>
        </div>
    </div>

    <script>
        let currentRow = null;

        function openModal(isEdit = false) {
            document.getElementById('modalTitle').innerText = isEdit ? "تعديل المنتج" : "إضافة منتج جديد";
            document.getElementById('productModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('productModal').style.display = 'none';
            currentRow = null;
        }

        function saveProduct() {
            const product = document.getElementById('inp-product').value;
            const dispatched = document.getElementById('inp-dispatched').value;
            const stock = document.getElementById('inp-stock').value;

            // تحديد الحالة بناءً على المخزون
            let statusText = "متوفر";
            let statusClass = "status-available";
            if (parseInt(stock) <= 5) {
                statusText = "منخفض جداً";
                statusClass = "status-low";
            }

            if (currentRow) {
                // تعديل الصف الحالي
                currentRow.cells[0].querySelector('span').innerText = product;
                currentRow.cells[1].querySelector('span').innerText = dispatched;
                currentRow.cells[2].querySelector('span').innerText = stock;
                currentRow.cells[3].innerHTML = `<span class="status-badge ${statusClass}">${statusText}</span>`;
            } else {
                // إضافة صف جديد
                const tbody = document.getElementById('inventory-table');
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><span class="badge-num num-green">${product}</span></td>
                    <td><span class="badge-num num-red">${dispatched}</span></td>
                    <td><span class="num-dark">${stock}</span></td>
                    <td><span class="status-badge ${statusClass}">${statusText}</span></td>
                    <td>
                        <button class="btn btn-edit" onclick="editRow(this)"><i class="fa-solid fa-pen"></i></button>
                        <button class="btn btn-delete" onclick="deleteRow(this)"><i class="fa-solid fa-trash"></i></button>
                    </td>
                `;
                tbody.appendChild(tr);
            }

            closeModal();
        }

        function editRow(btn) {
            currentRow = btn.closest('tr');
            document.getElementById('inp-product').value = currentRow.cells[0].innerText.trim();
            document.getElementById('inp-dispatched').value = currentRow.cells[1].innerText.trim();
            document.getElementById('inp-stock').value = currentRow.cells[2].innerText.trim();
            openModal(true);
        }

        function deleteRow(btn) {
            if (confirm("هل أنت تأكد من حذف هذا العنصر؟")) {
                const row = btn.closest('tr');
                row.remove();
            }
        }
    </script>
</body>
</html>
